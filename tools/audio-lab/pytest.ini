[pytest]
testpaths = common critic gen build sampler board harness specs
pythonpath = .
addopts = --import-mode=importlib
cache_dir = $AUDIOLAB_HOME/cache/pytest
python_files = test_*.py
# pytest skips dirs named build by default; ours holds tests.
norecursedirs = .* __pycache__ node_modules venv .venv poc *.egg-info
filterwarnings =
    ignore::DeprecationWarning
