notes: 'Q6 (24/10): bốn phần theo ví dụ của chủ dự án: khè hoặc gầm họng ngắn của sinh vật lớn (chuẩn bị), lửa bắt dưới áp lực (phát), lửa gầm và cầu lửa lao xa với whoosh dày (thân), vang thung lũng, rừng thấp (đuôi). Dài 340 → 750 ms (catalog; Q6 đề xuất file 600–900 ms gồm vang sớm: đã chọn theo đề xuất, 750 ± 20 % đúng bằng 600–900 ms); bus world của game thêm vang chung cho đuôi dài. Khóa E–H thay A–D của lô 1 (A, C ''phụt tròn'', D ''fire puff'' bị Q6 bỏ; B ''close, dry'' trái luật đuôi). Âm phát sau mỗi từ: năng lượng 1–4 kHz chỉ ở đầu tiếng, đuôi dưới 1 kHz và thấp. Ghi chú trước Q6: Lô 1 (24/10/2026): A, C hướng ''phụt tròn''; B, D hướng ''khạc có hơi thở'' (bảng phong cách mục 9 bước 2). Không viết chữ phủ định trong prompt: ''no birds'' của amb.forest từng sinh ra tiếng chim.'
