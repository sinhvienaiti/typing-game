# Thẻ spec âm thanh (AUDIO_PIPELINE §5.1 bước 1). Sinh bởi `pnpm audio:specs generate`; kiểm bằng `pnpm audio:specs validate`.
# Sửa tay: thêm `manual: true` vào mục đã sửa, hoặc ghi đường dẫn (vd. duration.target_ms) vào manual_fields.
# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: fire.cast
game: dragon-hold
status: draft
manual_fields:
  - purpose
  - prompt.text
  - critic.intent
  - duration.target_ms
  - duration.min_ms
  - duration.max_ms
when: 'Xong từ có mục tiêu: Hỏa Long khạc cầu lửa'
purpose: Khè họng của thú lớn, lửa bắt cháy dưới áp lực rồi gầm, cầu lửa lao ra xa; vang thung lũng thấp
category: word-reward
family: thuong
source_class: shot
playback:
  mode: one-shot
  channels: mono
  channels_basis: 'M0_SOUND_LIST §1: Tiếng lẻ mono. Nhạc và nền stereo'
  bus: world
  priority: 4
  min_gap_ms: 45
  limit_group: null
  caps: {}
  format: OGG Vorbis 48 kHz trong game; gốc WAV 48 kHz (§4.3.1, §11)
duration:
  target_ms: 750
  tolerance_pct: 20
  tolerance_ms: null
  min_ms: 600
  max_ms: 900
  basis: src/audio/catalog.ts lengthMs (nguồn chuẩn của độ dài)
  category_range_ms: [150, 900]
  music: null
onset:
  class: other
  rise_max_ms: null
  lead_silence_max_ms: 5
  basis: AUDIO_PIPELINE §4.3.1 (thời gian lên, im lặng ở đầu)
variants:
  target: 4
  min: 1
  max: 4
  basis: 'AUDIO_PIPELINE §4.3.3 (Thưởng xong từ); §9 #1: 4'
randomisation:
  group: word-reward
  pitch_cents: 30
  gain_db: 1
  rules: ['±20–30 cent, hoặc leo một bậc thang âm', Phát sau mỗi từ nên cần chút khác biệt]
  current_code: ±4 % cao độ (khoảng ±68 cent), ±1,5 dB, lệch 0–12 ms (catalog vary)
  basis: AUDIO_PIPELINE §5.3 (mã cần cho mỗi nhóm giá trị riêng, §6.3)
frequency_role:
  bands:
    - band: pitched
      range_hz: null
      role: Chuông nhỏ và đàn hạc theo ngũ cung
    - band: body
      range_hz: [120, 800]
      role: Thân lửa, thân quái
    - band: sub
      range_hz: [20, 120]
      role: Thân gầm rồng, Bom Hạt Thông
  voice_band: decay-15db-100ms
  voice_band_text: Năng lượng 1–4 kHz giảm ít nhất 15 dB trong 100 ms sau đầu tiếng; phần ngân dưới 1 kHz hoặc trên 4 kHz (§6.2)
  spectrum: Nốt đúng thang, lệch không quá 10 cent. Năng lượng 1–4 kHz giảm ít nhất 15 dB trong 100 ms sau đầu tiếng (§6.2)
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
  file:
    metric: peak-dbtp
    target: -1
    basis: 'M0_SOUND_LIST §1: Tiếng lẻ chuẩn hóa đỉnh −1 dBTP'
  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: world
  bus_gain: 0.75
  bus_gain_db: -2.5
  gain_db: -3
  gain_basis: src/audio/catalog.ts gainDb (mặc định 0 dB), mức trước bus
  relative_db: -5.5
  pronunciation_duck_db: -6.0
  mix_target:
    metric: lufs-m-max
    range: [-22, -16]
    text: Từ −22 (bậc C) đến −16 (bậc S)
    weight: null
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
prompt:
  text: Large dragon throat huff into a pressurised flame ignition that roars, then a thick fireball whoosh travelling away, low valley echo tail, 750 ms
  suffix: null
  style_root: painterly fantasy forest, warm, organic, outdoor
  sweetener: than hồng lách tách và đàn hạc
  variants:
    - 'E: TrackType: SFX, a huge dragon spits a fireball, a short throaty growl-huff from a large creature, a pressurised burst of flame igniting and roaring, a thick whoosh rushing away into a forest valley, low distant echo'
    - 'F: A big beast breathes out a fireball, deep raspy throat exhale, gas flame ignites under pressure with a hard roar, the fire rushes off into the distance, dark low valley reverberation, outdoor'
    - 'G: TrackType: SFX, fantasy dragon fire attack, heavy chest rumble and throat hiss, blowtorch-like flame burst roaring, fireball flying away with a dense whoosh, echo off pine hills, powerful, organic'
    - 'H: Flamethrower burst recorded outdoors in a wide valley, a deep animal huff before it, pressurised flame roar, thick moving whoosh fading away, long low echo, weighty'
  basis: docs/audio/M0_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
