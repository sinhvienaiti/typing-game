prompt:
  text: 'Exhausted dragon: a long falling groan from a huge creature, heavy body collapsing onto earth, fire guttering out, long low valley echo, 1.6 s'
  suffix: null
  style_root: painterly fantasy forest, warm, organic, outdoor
  sweetener: than hồng lách tách và đàn hạc
  variants:
    - 'A: TrackType: SFX, a huge dragon collapses, a long weary groan sinking in pitch, heavy body falling onto the ground with scales scraping, flames dying with a soft hiss, long low valley echo'
    - 'B: Giant beast slowly going down, deep tired moan, the ground shaking under a heavy body, embers fizzling out, dark reverberation across hills'
    - 'C: TrackType: SFX, fantasy dragon defeat, strained fading roar, massive body slumping onto rock and dirt, a last breath of fire hissing out, wide forest echo, sad and weighty'
    - 'D: Large creature exhaling its last strength, long low groan, heavy collapse with dust and stones, crackling fire dying away, long outdoor reverb tail'
  basis: docs/audio/M0_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
