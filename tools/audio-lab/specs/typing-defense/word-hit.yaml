# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: word-hit
game: typing-defense
status: draft
manual_fields: []
when: Gõ xong một từ
purpose: Thưởng, có nhạc tính
category: word-reward
family: thuong
source_class: folk-instrument
playback:
