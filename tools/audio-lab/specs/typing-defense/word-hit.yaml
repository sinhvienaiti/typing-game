  channels: mono
  channels_basis: 'THEME_SOUND_LIST §1: mono cho tiếng ngắn, stereo cho nhạc và âm nền'
  bus: typing
  priority: null
  min_gap_ms: null
  limit_group: null
  caps: {}
  format: OGG Vorbis 48 kHz trong game; gốc WAV 48 kHz (§4.3.1, §11)
duration:
  target_ms: 800
  tolerance_pct: 20
  tolerance_ms: null
  min_ms: 640
  max_ms: 960
  basis: Prompt trong docs/audio/THEME_SOUND_LIST.md
  category_range_ms: [150, 900]
  music: null
onset:
  class: other
  rise_max_ms: null
  lead_silence_max_ms: 5
  basis: AUDIO_PIPELINE §4.3.1 (thời gian lên, im lặng ở đầu)
variants:
  target: 7
  min: 7
  max: 7
  basis: '6 nốt và 1 bản vuốt lên: mỗi nốt một file (THEME_SOUND_LIST §2, §9 #21); §9 #21: 7 file'
randomisation:
  group: word-reward
  pitch_cents: 30
  gain_db: 1
  rules: ['±20–30 cent, hoặc leo một bậc thang âm', Phát sau mỗi từ nên cần chút khác biệt]
  current_code: Nốt theo bậc Chuỗi trên ngũ cung; Chớp có vuốt lên; Ẩu thấp một bậc (mã tổng hợp)
  basis: AUDIO_PIPELINE §5.3 (mã cần cho mỗi nhóm giá trị riêng, §6.3)
frequency_role:
  bands:
    - band: pitched
      range_hz: null
      role: word-hit đàn tranh theo thang Hò–Xự–Xang–Xê–Cống
  voice_band: decay-15db-100ms
  voice_band_text: Năng lượng 1–4 kHz giảm ít nhất 15 dB trong 100 ms sau đầu tiếng; phần ngân dưới 1 kHz hoặc trên 4 kHz (§6.2)
  spectrum: Nốt đúng thang, lệch không quá 10 cent. Năng lượng 1–4 kHz giảm ít nhất 15 dB trong 100 ms sau đầu tiếng (§6.2)
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
