    metric: peak-dbtp
    target: -1
    basis: 'THEME_SOUND_LIST §1: Tiếng ngắn đỉnh −1 dBTP (TK 24.9)'
  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: typing
  bus_gain: 1.0
  bus_gain_db: 0.0
  gain_db: 0
  gain_basis: 'Mã không có mức riêng cho từng id: nhánh TypingAudio nối thẳng vào bus, mức nằm trong mã tổng hợp. File phát ở 0 dB vào bus'
  relative_db: 0
  pronunciation_duck_db: null
  mix_target:
    metric: lufs-m-max
    range: [-22, -16]
    text: Từ −22 (bậc C) đến −16 (bậc S)
    weight: null
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
prompt:
  text: Single plucked note on a Vietnamese đàn tranh zither, bright attack, short warm ring 0.8 s; record one file per pitch C5, D5, F5, G5, A5, C6 and a version with an upward slide into the note.
  suffix: Single isolated sound effect, close and dry, starts instantly, clean natural end, 48 kHz.
  style_root: bamboo, wood, bronze, paper, Vietnamese village, dry, outdoor
  sweetener: tre, chuông đồng và đàn tranh
  variants: []
  basis: docs/audio/THEME_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
