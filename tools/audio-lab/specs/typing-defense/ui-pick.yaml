  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: ui
  bus_gain: 1.0
  bus_gain_db: 0.0
  gain_db: 0
  gain_basis: 'Mã không có mức riêng cho từng id: nhánh TypingAudio nối thẳng vào bus, mức nằm trong mã tổng hợp. File phát ở 0 dB vào bus'
  relative_db: 0
  pronunciation_duck_db: null
  mix_target:
    metric: lufs-m-max
    range: [-30, -22]
    text: Không to hơn phím
    weight: null
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
