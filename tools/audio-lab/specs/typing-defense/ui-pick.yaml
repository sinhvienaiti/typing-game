licence:
  allowed: [CC0-1.0, owner-original]
  conditional:
    - licence: CC0-1.0 (Freesound, người tải lên từ chối AI)
      condition: Chỉ ghép tay, không vào bước AI nào, không vào LoRA (§10.2)
    - licence: release-CC0-or-transfer
      condition: 'Bản ghi của người khác: cần giấy đồng ý (§10.4)'
    - licence: Stability-Community-2024
      condition: 'Bước 0: đăng ký Community License, chấp nhận AUP và điều khoản Gemma; có licences/stability-registration.txt (§10.1)'
    - licence: MIT (ACE-Step 1.5)
      condition: Ghim phiên bản; kiểm giai điệu trước khi bán
    - licence: Apache-2.0 (MOSS-SoundEffect)
      condition: Chỉ khi bước 0 trả lời không
  forbidden:
    - non-commercial-weights
    - freesound-cc-by-nc
    - freesound-sampling-plus
    - bbc-sound-effects
    - pixabay
    - sound-from-other-games
    - sonniss-lot-1-2-and-any-ai-step
    - elevenlabs-or-suno-free-tier-release
  attribution_required: false
  notes:
    - Kenney, VCSL, VSCO-2-CE, Freesound CC0. Lưu LICENSE-<ngày>.txt kèm thư viện
    - 'Chưa cài: chờ bước 0 của chủ dự án'
  record: art-src/audio/SOURCES.json và licences.jsonl (§10.5, §10.6); pnpm audio:licence-check chặn khi thiếu
  basis: AUDIO_PIPELINE §10.2
constraints:
  - 'Chất liệu: tre, gỗ, chuông đồng, cồng, giấy, trống cơm, sáo trúc, đàn tranh. Không laser, không tiếng máy, không synth điện tử'
  - Thang ngũ cung Hò, Xự, Xang, Xê, Cống (gần C D F G A); nốt của chữ và nhạc cùng một thang (TK 24.8)
  - 'Không tôn giáo (TK 22.1): không chuông chùa, không mõ chùa, không tụng; cồng là cồng hội làng; phách tre thay mõ'
  - 'Tránh âm Trung Quốc hay Nhật Bản dán nhãn Việt: nhị dẫn giai điệu, shakuhachi, taiko (§8.2)'
