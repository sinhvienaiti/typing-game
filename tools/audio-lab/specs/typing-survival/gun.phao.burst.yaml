  bus: impacts
  priority: null
  min_gap_ms: 45
  limit_group: null
  caps: {}
  format: OGG Vorbis 48 kHz trong game; gốc WAV 48 kHz (§4.3.1, §11)
duration:
  target_ms: 600
  tolerance_pct: 20
  tolerance_ms: null
