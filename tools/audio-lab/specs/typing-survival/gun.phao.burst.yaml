  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants:
    - 'A: TrackType: SFX, heavy sci-fi mortar shell exploding on a steel deck, sharp crack, deep boom with body, shrapnel and debris rattling, echo rolling down a steel corridor, punchy'
