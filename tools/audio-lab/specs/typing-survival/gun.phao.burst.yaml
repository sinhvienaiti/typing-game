    - 'C: TrackType: SFX, explosive round bursting, bright crack on impact, thick low-mid explosion body, scattered debris pinging off metal, steel hall tail, gritty'
    - 'D: Mortar impact on an industrial station floor, snapping crack, rolling powerful boom, scrap metal raining down, echo fading along a steel corridor'
  basis: docs/audio/THEME_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
