# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: gun.phao.burst
game: typing-survival
status: draft
manual_fields: []
when: Quả Pháo Sao nổ
purpose: Tiếng nổ trầm có thân, mảnh vỡ rơi lách cách; vang dội hành lang thép
category: blast
family: 'no'
source_class: blast
playback:
