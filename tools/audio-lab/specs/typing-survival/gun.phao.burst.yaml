frequency_role:
  bands:
    - band: sub
      range_hz: [20, 120]
      role: Sub súng, sub dùng chung hit.sub
    - band: presence
      range_hz: [4000, 8000]
      role: Tách phím, lách tách điện, đầu tiếng hit.t1
