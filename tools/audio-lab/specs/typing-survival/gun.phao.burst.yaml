notes: 'Q6 (25/10, thẻ mới): tiếng rít bay là phần chuẩn bị, nằm ở gun.phao.launch (quả đạn nổ sau 0,7 s bay). Nứt giòn (phát), nổ trầm có thân (thân), mảnh vỡ lách cách và vang lăn dọc hành lang (đuôi). Lớp trầm chỉ ở dưới thân. Nhịp 750 ms theo PHAO; khoảng cách tối thiểu 45 ms (GUN_BUS). Biến thể A–D mới (thẻ chưa có ứng viên nào), không chữ cấm, không chữ phủ định.'
