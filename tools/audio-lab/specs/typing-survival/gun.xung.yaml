notes: 'Q6 (24/10): đã soát, thiết kế lô 1 đã theo Q6: khóa nòng (chuẩn bị), đấm và nổ giòn (phát), thân dày ngắn, vang hành lang rất ngắn trong file; đuôi dài khi ngừng bắn là gun.xung.tail, đuôi thép dùng chung là hit.tail. Súng phát 5 lần mỗi giây nên mỗi phát ngắn. Bỏ A (''no long reverb'', chữ phủ định) và G (''short boomy thump''); giữ B–D, E, F, H; thêm I, J (cả phát). Prompt trong THEME_SOUND_LIST.md nay ghi 350 ms, khớp duration (manual) 96–380 ms của lô 1. Ghi chú trước Q6: Lô 0b: prompt A–D của bản thử Stable Audio 3 (23/10/2026), giữ để tạo lại đúng ứng viên. Lô 1 (24/10/2026, BATCH1_BRIEF.md): E–H là prompt thân (1 s) cho họ súng liên thanh (mục 3). duration (manual, 96–380 ms) là ngoại lệ của lô 1: phát đơn có đầu 0–120 ms và đuôi tắt dần tới khoảng 350 ms (mục 3.2), chờ người điều phối sửa THEME_SOUND_LIST.md; bỏ khi tài liệu game đổi.'
