  text: 'Heavy autocannon single shot from a steel turret: a breech clack, a deep punch with a sharp crack and a short thick body, a quick slap off the steel corridor, 350 ms, industrial.'
  suffix: null
  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants:
    - 'B: Single gunshot, large caliber cannon firing once, powerful low thump and crisp crack, short, close mic, dry, slightly distorted'
    - 'C: TrackType: SFX, one shot of a heavy machine gun, punchy low-end boom, metallic bolt clack, very short tail, gritty'
    - 'D: Heavy artillery cannon blast, single shot, deep thump with a sharp transient crack, steel mechanism clank, short, dry, distorted metal, close'
    - 'E: TrackType: SFX, heavy autocannon firing a single round inside a steel turret, deep chesty body, punchy low-mid thump, short, close, dry, industrial'
    - 'F: TrackType: SFX, one heavy cannon shot, thick low-mid punch and a short metallic body resonance, tight, close mic, dry, industrial steel'
    - 'H: TrackType: SFX, heavy turret gun single shot, powerful chest thump with a brief steel ring, short and tight, close, dry'
    - 'I: TrackType: SFX, heavy autocannon single shot inside a steel turret, mechanical breech clack, deep punch with a sharp crack, short thick body, quick slap echo off a steel corridor, industrial'
    - 'J: Large caliber cannon firing once in a metal hangar, bolt slamming home, powerful chesty blast with a gritty crack, brief metallic reverberation, close'
  basis: docs/audio/THEME_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
