  spectrum: 'Súng: từ 25 % năng lượng dưới 150 Hz, crest từ 12 dB. Khạc hoặc phóng: dưới 120 Hz thấp hơn ít nhất 12 dB'
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
