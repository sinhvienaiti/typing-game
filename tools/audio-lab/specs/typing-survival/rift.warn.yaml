  tolerance_pct: 20
  tolerance_ms: null
  min_ms: 2000
  max_ms: 3000
  basis: Prompt trong docs/audio/THEME_SOUND_LIST.md
  category_range_ms: [250, 2000]
  music: null
onset:
  class: none
  rise_max_ms: null
  lead_silence_max_ms: 5
