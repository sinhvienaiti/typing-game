notes: 'Báo nguy, không phải âm hành động: tường thép rên, nhiệt dồn 2,5 s trước khi vết nứt mở (rift.open). Prompt trong danh sách nay ghi ''2.5 s'' để bộ sinh đọc được độ dài (trước đó ghi ''2.5 seconds'', thẻ không có duration.target_ms), và bỏ ''no music''. Nguồn sửa trong RULES: Stable Audio 3 hoặc ghép tiếng thép rên CC0, vì nguồn mặc định của nhóm báo nguy là kèn, cồng. Dài 2,5 s, quá 0,25–2 s của nhóm Báo nguy (chỉ để xếp hạng). Biến thể A–D mới, viết khẳng định.'
