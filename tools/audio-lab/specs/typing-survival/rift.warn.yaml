    - Chuỗi thưởng leo nốt theo thang, tối đa 8–12 bậc
  current_code: Tổng hợp trong mã; khi có file, SceneAudio của kit đổi ±5 % tốc độ phát cho mọi âm (§5.3)
  basis: AUDIO_PIPELINE §5.3 (mã cần cho mỗi nhóm giá trị riêng, §6.3)
frequency_role:
  bands:
    - band: sub
      range_hz: [20, 120]
      role: Sub súng, sub dùng chung hit.sub
    - band: body
      range_hz: [120, 800]
      role: Thân súng, thân tiếng trúng
  voice_band: short-warning
  voice_band_text: Báo nguy ngắn; không có âm kéo dài ở 1–4 kHz
  spectrum: Không có âm kéo dài ở 1–4 kHz
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
  file:
    metric: peak-dbtp
    target: -1
    basis: 'THEME_SOUND_LIST §2: đỉnh −1 dBFS'
  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: alerts
  bus_gain: 0.8
  bus_gain_db: -1.94
  gain_db: 0
  gain_basis: 'Mã không có mức riêng cho từng id: voice() nối thẳng vào bus, mức nằm trong mã tổng hợp. File phát ở 0 dB vào bus'
  relative_db: -1.94
  pronunciation_duck_db: -1.94
  mix_target:
    metric: lufs-m-max
    range: [-17, -14]
    text: null
    weight: null
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
