  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants:
    - 'A: TrackType: SFX, steel wall groaning under heat and pressure, rising rumble and creaks building up over 2.5 seconds, tense, industrial'
    - 'B: Metal bulkhead straining as heat builds, deep low drone swelling, stressed steel creaking and ticking, growing tension, industrial station'
    - 'C: TrackType: SFX, overheating hull plate about to tear, low rumble climbing steadily, sharp metallic creaks and pings, hiss of heat, ominous'
    - 'D: Huge steel structure under rising pressure, groaning metal, deep vibrating hum getting louder, rivets snapping one by one'
