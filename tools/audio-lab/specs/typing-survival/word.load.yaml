  spectrum: Nốt đúng thang, lệch không quá 10 cent. Năng lượng 1–4 kHz giảm ít nhất 15 dB trong 100 ms sau đầu tiếng (§6.2)
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
