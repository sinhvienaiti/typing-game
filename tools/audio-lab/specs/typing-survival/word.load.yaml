# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: word.load
game: typing-survival
status: draft
manual_fields: []
when: 'Gõ xong một từ: một băng đạn nạp vào súng'
purpose: '"Cạch-chắc": băng đạn đóng sập vào ổ, chốt khóa'
category: word-reward
family: thuong
source_class: impact
playback:
