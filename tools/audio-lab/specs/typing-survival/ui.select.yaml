      role: Tách phím, lách tách điện, đầu tiếng hit.t1
  voice_band: soft-short
  voice_band_text: Mềm và ngắn; không to hơn phím
  spectrum: 1–5 kHz, mềm
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
