notes: 'Q6 (24/10): đã soát: đầu tiếng + thân của bậc T2, cú thụi trầm nằm dưới tiếng keng, hit.sub ghép thêm lúc chạy; không có chữ cấm, giữ A–D. Ghi chú trước Q6: Lô 1 (24/10/2026, BATCH1_BRIEF.md): thân và đầu tiếng của bậc T2; hit.sub ghép thêm lúc chạy (bản nghe ghép sẵn).'
