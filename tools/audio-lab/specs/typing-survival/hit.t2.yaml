# Thẻ spec âm thanh (AUDIO_PIPELINE §5.1 bước 1). Sinh bởi `pnpm audio:specs generate`; kiểm bằng `pnpm audio:specs validate`.
# Sửa tay: thêm `manual: true` vào mục đã sửa, hoặc ghi đường dẫn (vd. duration.target_ms) vào manual_fields.
# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: hit.t2
game: typing-survival
status: draft
manual_fields: []
when: Chí mạng, gõ chuẩn (T2, T3)
purpose: Keng nặng hơn, thêm cú thụi trầm
category: hit-heavy
family: trung
source_class: impact
playback:
  mode: one-shot
  channels: mono
  channels_basis: 'THEME_SOUND_LIST §2: mono (trừ nhạc và end.*)'
  bus: impacts
  priority: null
  min_gap_ms: null
  limit_group: null
  caps: {}
  format: OGG Vorbis 48 kHz trong game; gốc WAV 48 kHz (§4.3.1, §11)
duration:
  target_ms: 160
  tolerance_pct: 20
  tolerance_ms: null
  min_ms: 128
  max_ms: 192
  basis: Prompt trong docs/audio/THEME_SOUND_LIST.md
  category_range_ms: [120, 600]
  music: null
onset:
  class: impact
  rise_max_ms: 10
  lead_silence_max_ms: 5
  basis: 'AUDIO_PIPELINE §4.3.1 (thời gian lên, im lặng ở đầu); THEME_SOUND_LIST §2: cắt im lặng đầu file, tiếng phải bắt đầu ngay, dưới 5 ms'
variants:
  target: 4
  min: 3
  max: 6
  basis: 'AUDIO_PIPELINE §4.3.3 (Trúng vừa, nặng); §9 #13: 4'
randomisation:
  group: hit-heavy
  pitch_cents: 80
  gain_db: 1
  rules: [Hạ tiếng trúng nhỏ 3–6 dB trong 150 ms]
  current_code: Tổng hợp trong mã; khi có file, SceneAudio của kit đổi ±5 % tốc độ phát cho mọi âm (§5.3)
  basis: AUDIO_PIPELINE §5.3 (mã cần cho mỗi nhóm giá trị riêng, §6.3)
frequency_role:
  bands:
    - band: body
      range_hz: [120, 800]
      role: Thân súng, thân tiếng trúng
    - band: sub
      range_hz: [20, 120]
      role: Sub súng, sub dùng chung hit.sub
  voice_band: onset-only
  voice_band_text: Chỉ đầu tiếng rất ngắn ở 1–4 kHz; không ngân ở dải giọng đọc (§6.4)
  spectrum: Tiếng nặng có sub 40–90 Hz, dài không quá 150 ms
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
  file:
    metric: peak-dbtp
    target: -1
    basis: 'THEME_SOUND_LIST §2: đỉnh −1 dBFS'
  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: impacts
  bus_gain: 0.6
  bus_gain_db: -4.44
  gain_db: 0
  gain_basis: 'Mã không có mức riêng cho từng id: voice() nối thẳng vào bus, mức nằm trong mã tổng hợp. File phát ở 0 dB vào bus'
  relative_db: -4.44
  pronunciation_duck_db: -6.02
  mix_target:
    metric: lufs-m-max
    range: [-19, -17]
    text: 'Vừa: −19 đến −17. Nặng: −16 đến −14'
    weight: medium
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
prompt:
  text: Heavy bullet impact on thick steel armor, clank with a low thump, 160 ms, punchy, dry.
  suffix: null
  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants:
    - 'A: TrackType: SFX, heavy bullet impact on thick steel armor, hard metallic clank with a low thump, short, punchy, close, dry'
    - 'B: Large caliber round hitting an armored steel plate, loud clank and a dense low-mid body, short, close mic, dry, industrial'
    - 'C: TrackType: SFX, metal impact one-shot, heavy projectile striking a thick steel door, crisp transient, solid body, short decay'
    - 'D: Critical hit on heavy steel armor, sharp crack and a deep clang, short, gritty, close, dry'
  basis: docs/audio/THEME_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
pitches: null
parts: null
layer_plan:
  builds_on: null
  shares: [hit.sub, hit.tail]
  summary: 'Mỗi bậc có file đầu tiếng + thân riêng; hit.sub và hit.tail dùng chung, mã ghép theo cờ bass và tail của tiers.ts; giữ trong mã độ to theo số viên và độ dài theo bậc (§6.3 #3). Cần nâng kit SceneAudio trước (§6.3 #1)'
  related: []
references: []
source_plan:
  now: [cc0-layer, synth]
  later: [model-later]
  ranked:
    - rank: 1
      kinds: [cc0-layer, model-later]
      detail: 'Ghép lớp: lớp đầu từ Kenney Impact (CC0), thân và đuôi từ Stable Audio 3'
    - rank: 2
      kinds: [model-later]
      detail: Stable Audio 3 nguyên khối, tạo lại thân hoặc đuôi bằng inpaint
    - rank: 3
      kinds: [synth]
      detail: Tổng hợp
  needs_now: []
  needs_later: [buoc-0]
  note: 'Khi chưa có Stable Audio 3: lớp đầu Kenney Impact + thân tổng hợp (§10.1)'
  batch1:
    n: 13
    why: Chí mạng
    source: 'Thân nặng hơn #12. `hit.sub` tổng hợp, dùng chung'
    variants: '4'
  style_board: false
  sa3_trial: false
  basis: AUDIO_PIPELINE §3.2 (nguồn theo loại âm), §10.1 (khi chưa có Stable Audio 3)
licence:
  allowed: [CC0-1.0, project-code]
  conditional:
    - licence: CC0-1.0 (Freesound, người tải lên từ chối AI)
      condition: Chỉ ghép tay, không vào bước AI nào, không vào LoRA (§10.2)
    - licence: Stability-Community-2024
      condition: 'Bước 0: đăng ký Community License, chấp nhận AUP và điều khoản Gemma; có licences/stability-registration.txt (§10.1)'
    - licence: MIT (ACE-Step 1.5)
      condition: Ghim phiên bản; kiểm giai điệu trước khi bán
    - licence: Apache-2.0 (MOSS-SoundEffect)
      condition: Chỉ khi bước 0 trả lời không
  forbidden:
    - non-commercial-weights
    - freesound-cc-by-nc
    - freesound-sampling-plus
    - bbc-sound-effects
    - pixabay
    - sound-from-other-games
    - sonniss-lot-1-2-and-any-ai-step
    - elevenlabs-or-suno-free-tier-release
  attribution_required: false
  notes:
    - Kenney, VCSL, VSCO-2-CE, Freesound CC0. Lưu LICENSE-<ngày>.txt kèm thư viện
    - 'Chưa cài: chờ bước 0 của chủ dự án'
    - Mã của dự án. pedalboard (GPL-3.0) chỉ import trên máy, không chép vào repo (§10.9)
  record: art-src/audio/SOURCES.json và licences.jsonl (§10.5, §10.6); pnpm audio:licence-check chặn khi thiếu
  basis: AUDIO_PIPELINE §10.2
constraints:
  - 'Âm industrial: thép, súng nặng, điện, kim loại vỡ; khác tiếng laser và nhạc điện tử vũ trụ của Space Typing (THEME_SOUND_LIST)'
