    - rank: 2
      kinds: [cc0-layer]
      detail: Một mẫu thu thật Kenney CC0, mã đổi cao độ
    - rank: 3
      kinds: [owner-recording]
      detail: Một mẫu tự ghi, mã đổi cao độ
  needs_now: []
  needs_later: []
  note: Mô hình khuếch tán yếu với tiếng dưới 50 ms
  batch1: null
  style_board: false
  sa3_trial: false
  basis: AUDIO_PIPELINE §3.2 (nguồn theo loại âm), §10.1 (khi chưa có Stable Audio 3)
licence:
  allowed: [project-code, CC0-1.0, owner-original]
  conditional:
    - licence: CC0-1.0 (Freesound, người tải lên từ chối AI)
      condition: Chỉ ghép tay, không vào bước AI nào, không vào LoRA (§10.2)
    - licence: release-CC0-or-transfer
      condition: 'Bản ghi của người khác: cần giấy đồng ý (§10.4)'
  forbidden:
    - non-commercial-weights
    - freesound-cc-by-nc
    - freesound-sampling-plus
    - bbc-sound-effects
    - pixabay
    - sound-from-other-games
    - sonniss-lot-1-2-and-any-ai-step
    - elevenlabs-or-suno-free-tier-release
  attribution_required: false
  notes:
