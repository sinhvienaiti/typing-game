# Thẻ spec âm thanh (AUDIO_PIPELINE §5.1 bước 1). Sinh bởi `pnpm audio:specs generate`; kiểm bằng `pnpm audio:specs validate`.
# Sửa tay: thêm `manual: true` vào mục đã sửa, hoặc ghi đường dẫn (vd. duration.target_ms) vào manual_fields.
# status, references, prompt.variants, notes luôn được giữ khi sinh lại. Comment YAML thì không: ghi chú để ở notes.
schema: 1
id: key.ok
game: typing-survival
status: draft
manual_fields: []
when: Mỗi phím đúng
purpose: 'Rơ-le đóng trên bàn phím thép: khô, ngắn, chắc tay; 5 cao độ xoay vòng ±3 %'
category: key-ok
family: phim-ui
source_class: key
playback:
  mode: one-shot
  channels: mono
  channels_basis: 'THEME_SOUND_LIST §2: mono (trừ nhạc và end.*)'
  bus: keys
  priority: null
  min_gap_ms: null
  limit_group: null
  caps: {}
  format: OGG Vorbis 48 kHz trong game; gốc WAV 48 kHz (§4.3.1, §11)
duration:
  target_ms: 40
  tolerance_pct: 20
  tolerance_ms: null
  min_ms: 32
  max_ms: 48
  basis: Prompt trong docs/audio/THEME_SOUND_LIST.md
  category_range_ms: [15, 60]
  music: null
onset:
  class: key
  rise_max_ms: 3
  lead_silence_max_ms: 2
  basis: 'AUDIO_PIPELINE §4.3.1 (thời gian lên, im lặng ở đầu); THEME_SOUND_LIST §2: cắt im lặng đầu file, tiếng phải bắt đầu ngay, dưới 5 ms'
variants:
  target: 4
  min: 4
  max: 6
  basis: 'THEME_SOUND_LIST §2: tiếng lặp nhiều cần 4–6 biến thể'
randomisation:
  group: key-ok
  pitch_cents: 50
  gain_db: 1
  rules: [Tránh lặp 2 bản gần nhất]
  current_code: 5 cao độ xoay vòng theo chữ, thêm ±3 % ngẫu nhiên (mã tổng hợp)
  basis: AUDIO_PIPELINE §5.3 (mã cần cho mỗi nhóm giá trị riêng, §6.3)
frequency_role:
  bands:
    - band: presence
      range_hz: [4000, 8000]
      role: Tách phím, lách tách điện, đầu tiếng hit.t1
    - band: body
      range_hz: [120, 800]
      role: Thân súng, thân tiếng trúng
  voice_band: onset-only
  voice_band_text: Chỉ đầu tiếng rất ngắn ở 1–4 kHz; không ngân ở dải giọng đọc (§6.4)
  spectrum: 'Đề xuất mới (§6.2): tiếng tách chủ yếu trên 4 kHz, thân dưới 800 Hz, dải 1–4 kHz thấp hơn dải 4–8 kHz ít nhất 6 dB. Tài liệu game thắng cho đến khi sửa'
  basis: AUDIO_PIPELINE §6.4, AUDIO_PIPELINE §4.3.3
loudness:
  file:
    metric: peak-dbtp
    target: -1
    basis: 'THEME_SOUND_LIST §2: đỉnh −1 dBFS'
  proposal:
    metric: lufs-m-max
    target: -20
    pad_s: 0.4
    true_peak_max_dbtp: -1
    basis: 'AUDIO_PIPELINE §4.3.3, §5.1 bước 4: đề xuất chuẩn hóa mọi âm ngắn về một mức chung; tài liệu game đang ghi chuẩn hóa đỉnh'
  bus: keys
  bus_gain: 0.5
  bus_gain_db: -6.02
  gain_db: 0
  gain_basis: 'Mã không có mức riêng cho từng id: voice() nối thẳng vào bus, mức nằm trong mã tổng hợp. File phát ở 0 dB vào bus'
  relative_db: -6.02
  pronunciation_duck_db: -4.44
  mix_target:
    metric: lufs-m-max
    range: [-28, -24]
    text: null
    weight: null
    basis: AUDIO_PIPELINE §4.3.3 (mức trong bản trộn, bài A và B)
prompt:
  text: Single mechanical relay click on a heavy steel console, dry, tight, very short (40 ms), industrial keyboard, no reverb, no tail.
  suffix: null
  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants: []
  basis: docs/audio/THEME_SOUND_LIST.md; gốc prompt theo AUDIO_PIPELINE §5.2 (chốt sau bảng phong cách)
pitches: null
parts: null
layer_plan: null
