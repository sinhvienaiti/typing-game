prompt:
  text: 'Mortar launch from a steel tube: a shell sliding in with a clank, a strong deep launch blast with a ringing tube body, the shell whistling up and away, short steel corridor echo, 500 ms, industrial sci-fi.'
  suffix: null
  style_root: industrial, steel, close, punchy
  sweetener: tia điện và thép ngân
  variants:
    - 'A: TrackType: SFX, mortar launch from a steel tube, shell sliding in with a clank, strong deep launch blast with a ringing tube body, shell whistling up and away, short steel corridor echo, industrial'
