    - 'C: TrackType: SFX, heavy tube launcher shot, loading clank, deep powerful blast with a metallic tube body, projectile whooshing upward and away, steel hall tail'
    - 'D: Field mortar on a metal deck, shell clanking into the tube, chesty launch blast, the shell hissing high into the distance, short reverberation off steel walls'
