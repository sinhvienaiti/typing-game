notes: 'Q6 (24/10): đã soát: file bậc là đầu tiếng + thân (mục 6.3 #3); sub và đuôi thép là lớp dùng chung hit.sub, hit.tail do mã ghép, nên hình dạng Q6 đủ khi ghép. Bỏ A (''no reverb'') và C (''no tail''): chữ phủ định; bản anh chọn C s1006 vẫn là file gốc, chữ của C còn trong bản ghi ứng viên và lịch sử Git. Thêm F. Ghi chú trước Q6: Lô 0b: prompt A–D của bản thử Stable Audio 3 (23/10/2026), giữ để tạo lại đúng ứng viên. Lô 1 (24/10/2026, BATCH1_BRIEF.md): E nghiêng sáng hơn, thân vừa (mục 4.1 #12); gốc là C (anh chọn C s1006 thô).'
