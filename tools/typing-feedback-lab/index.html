<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Typing Feedback Lab</title>
    <link rel="stylesheet" href="/src/lab.css" />
  </head>
  <body>
    <div id="stage" class="lab-stage">
      <img id="backdrop" class="lab-backdrop" alt="" />
      <div id="today" class="lab-today" hidden></div>
      <div id="targetMark" class="lab-target"></div>
    </div>
    <aside id="panel" class="lab-panel">
      <header class="lab-head">
        <strong>Typing Feedback Lab</strong>
        <button id="collapse" type="button" title="Hide the panel (H)">Hide</button>
      </header>
      <section>
        <h2>Look</h2>
        <div class="lab-seg" id="ab">
          <button type="button" data-ab="new" class="is-on">New: focus strip</button>
          <button type="button" data-ab="today">Today (approx.)</button>
        </div>
        <label>Style</label>
        <div class="lab-seg lab-seg--wrap" id="styles"></div>
        <label>Intensity</label>
        <div class="lab-seg" id="intensity"></div>
        <label class="lab-check"><input type="checkbox" id="reduced" /> Reduced motion</label>
      </section>
      <section>
        <h2>Sound</h2>
        <label for="profile">Profile</label>
        <select id="profile"></select>
        <p class="lab-note" id="profileNote"></p>
        <label for="volume">Volume <span id="volumeOut"></span></label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7" />
      </section>
      <section>
        <h2>Game</h2>
        <select id="game"></select>
        <select id="level"></select>
      </section>
      <section>
        <h2>Try</h2>
        <div class="lab-buttons">
          <button type="button" id="simWrong">Wrong key</button>
          <button type="button" id="simPerfect">Perfect word</button>
          <button type="button" id="simCombo10">Combo ×10</button>
          <button type="button" id="simCombo25">Combo ×25</button>
          <button type="button" id="simSkip">Next word</button>
        </div>
        <label>Auto-type</label>
        <div class="lab-seg" id="bot">
          <button type="button" data-bot="0" class="is-on">Off</button>
          <button type="button" data-bot="5">5/s</button>
          <button type="button" data-bot="10">10/s</button>
          <button type="button" data-bot="15">15/s</button>
        </div>
        <p class="lab-note">Type the word on screen. Backspace takes a letter back.</p>
      </section>
      <section class="lab-readouts">
        <h2>Readouts</h2>
        <dl id="readouts"></dl>
      </section>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
