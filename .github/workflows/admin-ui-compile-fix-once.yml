name: Space Admin UI Compile Fix Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - name: Remove obsolete World Music renderer and fix selected Stage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('portal/src/admin/space-typing.ts')
          s = p.read_text()
          start = s.find('  private renderWorldMusic(): HTMLElement {')
          end = s.find('  private renderShips(): HTMLElement {', start)
          if start == -1 or end == -1:
              raise SystemExit('obsolete World Music renderer boundary not found')
          s = s[:start] + s[end:]
          # prettyWorld belonged exclusively to the obsolete renderer.
          s = s.replace('''\n  private prettyWorld(id: string): string {\n    const raw = id.replace("world-", "");\n    return `World ${raw}`;\n  }\n''', '\n')
          p.write_text(s)

          p = Path('portal/src/admin/space-typing-world-music-v2.ts')
          s = p.read_text()
          old = 'state.galaxy = g; state.world = world; state.scope = "world"; state.stages = new Set([1]);'
          new = 'state.galaxy = g; state.world = world; state.scope = "world"; state.stages = new Set([(world - 1) * 20 + 1]);'
          if old not in s:
              raise SystemExit('World Music selected Stage target not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/admin-ui-compile-fix-once.yml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(admin-ui): remove obsolete World Music renderer and preserve stage scope"
          git push origin HEAD:feat/space-typing-admin-uiux
