name: Space Admin UI Fix Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - name: Fix registry helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('portal/src/admin/space-typing-extended.ts')
          s = p.read_text()
          old = '  return Object.assign(page, { append: page.append(list, record ? detail(record) : panel("No selection"), actionBar()) });'
          new = '  page.append(list, record ? detail(record) : panel("No selection"), actionBar());\n  return page;'
          if old not in s:
              raise SystemExit('target registry helper expression not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/admin-ui-fix-once.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(admin-ui): preserve registry DOM append helper"
          git push origin HEAD:feat/space-typing-admin-uiux
