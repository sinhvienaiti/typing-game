name: Space Admin UI Validator Final Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Apply validator final guard
        run: node scripts/apply-space-admin-validator-final.mjs
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-space-admin-validator-final.mjs
          rm .github/workflows/admin-ui-validator-final-once.yml
      - name: Commit final validator guard
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(admin-ui): lock final Phase A regression guards"
          git push origin HEAD:feat/space-typing-admin-uiux
