name: Apply English E04 Scale 59

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - scripts/apply-english-e04-focused-scale-59.py
      - scripts/check-english-e04-scale-59-candidates.py
      - .github/workflows/apply-english-e04-scale-59.yml

permissions:
  contents: write

concurrency:
  group: english-e04-scale-59
  cancel-in-progress: false

jobs:
  apply-scale-59:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Replace conflicted scale 59 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-english-e04-focused-scale-59.py')
          text = path.read_text(encoding='utf-8')
          old = "    ('coordinate pushback clearance', 'verb + noun phrase', 'phối hợp cấp phép đẩy lùi giữa tổ lái, điều hành mặt đất và nhân viên kéo đẩy để tránh xung đột trên sân đỗ', 'C1'),"
          new = "    ('confirm tug headset communication', 'verb + noun phrase', 'xác nhận liên lạc tai nghe giữa tổ lái và nhân viên kéo đẩy rõ ràng và hoạt động đúng trước khi bắt đầu đẩy lùi', 'B2'),"
          if old not in text:
              if new in text:
                  print('Scale 59 conflict fix is already present.')
              else:
                  raise SystemExit('Expected scale 59 conflicted candidate not found.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Replaced exact-duplicate scale 59 candidate col.00001988.')
          PY
      - name: Preflight all scale 59 candidates against current E04
        run: python3 scripts/check-english-e04-scale-59-candidates.py
      - name: Apply idempotent E04 scale 59 source batch
        run: python3 scripts/apply-english-e04-focused-scale-59.py
      - name: Validate review and controlled-batch contracts
        run: |
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
      - name: Generate and publish reviewed runtime
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
      - name: Run full English-content quality gates
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Converge derived publication state
        shell: bash
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Stage reviewed source and generated runtime
        shell: bash
        run: |
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-59.py
          git status --short
          if git diff --cached --quiet; then
            echo 'Scale 59 produced no state change; it may already be applied.' >&2
            exit 1
          fi
          git diff --cached --binary > /tmp/scale59-before.patch
      - name: Verify full publication pipeline is deterministic
        shell: bash
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-59.py
          git diff --cached --binary > /tmp/scale59-after.patch
          if ! cmp -s /tmp/scale59-before.patch /tmp/scale59-after.patch; then
            echo 'Scale 59 artifacts are not reproducible after converging and replaying the full publication pipeline.' >&2
            diff -u /tmp/scale59-before.patch /tmp/scale59-after.patch || true
            exit 1
          fi
      - name: Commit validated scale 59 artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): publish E04 collocation scale 59'
          git push
