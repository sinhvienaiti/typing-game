name: Apply English E04 Scale 197
on:
  push:
    branches: [prep/e04-scale-197]
    paths:
      - scripts/apply-english-e04-focused-scale-197.py
      - scripts/check-english-e04-scale-197-candidates.py
      - scripts/english-e04-scale-197-common.py
      - scripts/e04-scale-197-candidates.json
      - scripts/e04-scale-197-candidate-replacements.json
      - scripts/update-english-e04-scale-197-progress.py
      - .github/workflows/apply-english-e04-scale-197.yml
permissions:
  contents: write
concurrency:
  group: english-e04-scale-197
  cancel-in-progress: false
jobs:
  apply-scale-197:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with: {version: 11.21.0}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 24.11.0}
      - name: Preflight scale 197 phrase candidates against current E04
        run: python3 scripts/check-english-e04-scale-197-candidates.py
      - name: Apply idempotent E04 scale 197 source batch
        run: python3 scripts/apply-english-e04-focused-scale-197.py
      - name: Validate review decisions
        id: review_validate
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm english-content:review:validate 2>&1 | tee /tmp/scale197-review-validate.log
      - name: Validate E10 controlled batches
        id: e10_validate
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm english-content:e10 2>&1 | tee /tmp/scale197-e10.log
      - name: Validate English content licenses
        id: licenses_validate
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm english-content:licenses 2>&1 | tee /tmp/scale197-licenses.log
      - name: Upload Scale 197 validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-197-validation-diagnostics
          path: |
            /tmp/scale197-review-validate.log
            /tmp/scale197-e10.log
            /tmp/scale197-licenses.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce validation gate
        if: ${{ always() && (steps.review_validate.outcome == 'failure' || steps.e10_validate.outcome == 'failure' || steps.licenses_validate.outcome == 'failure') }}
        run: |
          echo "review_validate=${{ steps.review_validate.outcome }}"
          echo "e10_validate=${{ steps.e10_validate.outcome }}"
          echo "licenses_validate=${{ steps.licenses_validate.outcome }}"
          exit 1
      - name: Generate and publish reviewed runtime
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
      - name: Run full English-content quality gates
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Converge derived publication state
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Stage reviewed source and generated runtime
        run: |
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-197.py scripts/english-e04-scale-197-common.py scripts/e04-scale-197-candidates.json scripts/e04-scale-197-candidate-replacements.json scripts/update-english-e04-scale-197-progress.py
          git status --short
          if git diff --cached --quiet; then echo 'Scale 197 produced no state change.' >&2; exit 1; fi
          git diff --cached --binary > /tmp/scale197-before.patch
      - name: Verify full publication pipeline is deterministic
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-197.py scripts/english-e04-scale-197-common.py scripts/e04-scale-197-candidates.json scripts/e04-scale-197-candidate-replacements.json scripts/update-english-e04-scale-197-progress.py
          git diff --cached --binary > /tmp/scale197-after.patch
          if ! cmp -s /tmp/scale197-before.patch /tmp/scale197-after.patch; then echo 'Scale 197 artifacts are not reproducible.' >&2; diff -u /tmp/scale197-before.patch /tmp/scale197-after.patch || true; exit 1; fi
      - name: Commit validated scale 197 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): publish E04 phrase scale 197'
          git push
