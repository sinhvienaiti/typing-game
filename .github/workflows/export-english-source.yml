name: Export English Source Snapshot

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - .github/workflows/export-english-source.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload English source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: english-source-snapshot-${{ github.sha }}
          path: |
            package.json
            content/english
            docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md
            docs/PROJECT_CONTEXT.md
            docs/TYPING_TEXT_PROCESS.md
            scripts
            shared/english-content
            shared/schemas/english-content
            shared/curriculum
            shared/dictionary
            shared/grammar
            shared/sentences
            shared/phrases
            shared/vocabulary/schema.json
            shared/vocabulary/lookup.json
          if-no-files-found: error
          retention-days: 1
