name: Apply English A1-02

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - .github/workflows/export-english-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply reviewed A1-02 source slice
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/apply-a102.py
          python3 /tmp/apply-a102.py
      - name: Validate reviewed source and ledger
        run: |
          node scripts/validate-english-content-reviews.mjs
          node scripts/validate-english-content.mjs
          node scripts/check-english-content-licenses.mjs
          node --test scripts/english-content-core.test.mjs scripts/english-review-core.test.mjs scripts/oewn-pinned-core.test.mjs scripts/tatoeba-pair-core.test.mjs scripts/multiwoz-dialogue-core.test.mjs scripts/wiktextract-enrichment-core.test.mjs shared/english-content/*.test.mjs
          node scripts/report-english-content-pilot.mjs
          node scripts/report-english-content-e04.mjs
      - name: Generate and verify runtime
        shell: bash
        run: |
          node scripts/generate-english-content.mjs
          git diff --exit-code -- shared/curriculum
          node scripts/publish-english-content.mjs
          node scripts/report-english-content-dedup.mjs
          node scripts/smoke-published-english-content.mjs
          node scripts/generate-english-content-release.mjs
          node scripts/audit-english-content-maintenance.mjs
          node scripts/sample-english-content-quality.mjs
          find shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/runtime-before.sha
          node scripts/publish-english-content.mjs
          find shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/runtime-after.sha
          diff -u /tmp/runtime-before.sha /tmp/runtime-after.sha
      - name: Commit canonical A1-02 batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/english/batches/manifest.json \
            content/english/grammar/e05-scale-a1-02-topics.json \
            content/english/sentences/e05-scale-a1-02-sentences.json \
            content/english/sentences/e05-scale-a1-02-exercises.json \
            content/english/sentences/e05-scale-a1-02-common-mistakes.json \
            content/english/reviews/decisions.d/e05-grammar-a1-02.json \
            content/english/releases/2026.10.0.json \
            scripts/validate-english-content.mjs \
            scripts/publish-english-content.mjs \
            scripts/smoke-published-english-content.mjs \
            shared/grammar \
            shared/sentences \
            docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(content): publish second A1 grammar body slice"
          git push origin HEAD:feature/english-learning-content-system
