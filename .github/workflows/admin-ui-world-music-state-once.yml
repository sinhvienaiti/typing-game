name: Space Admin UI World Music State Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Apply World Music mock-state fix
        run: node scripts/apply-space-admin-world-music-state.mjs
      - name: Run Admin UI validator
        run: node scripts/validate-space-admin-ui.mjs
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-space-admin-world-music-state.mjs
          rm .github/workflows/admin-ui-world-music-state-once.yml
      - name: Commit World Music state consistency fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(admin-ui): sync World Music assignment mock state"
          git push origin HEAD:feat/space-typing-admin-uiux
