name: Space Typing Admin CI

on:
  push:
    branches:
      - feat/space-typing-admin-mvp
      - feat/space-typing-admin-uiux
  pull_request:
    paths:
      - "admin/**"
      - "portal/src/admin/**"
      - "portal/src/main.ts"
      - "portal/vite.config.ts"
      - "games/space-typing"
      - "shared/vocabulary/**"
      - "shared/typing-texts/**"
      - "scripts/validate-space-admin-contract.mjs"
      - "scripts/validate-space-admin-ui.mjs"
      - "scripts/validate-space-admin-phase-b.mjs"
      - "scripts/validate-space-admin-worlds.mjs"
      - "scripts/validate-space-admin-typing-content.mjs"
      - "scripts/validate-space-admin-shop.mjs"
      - "scripts/validate-space-admin-currencies.mjs"
      - "scripts/validate-space-admin-rewards.mjs"
      - "scripts/validate-space-admin-warp.mjs"
      - "scripts/validate-space-admin-missions.mjs"
      - "scripts/validate-space-admin-feature-gates.mjs"
      - "scripts/validate-space-admin-events.mjs"
      - "scripts/validate-space-admin-duel.mjs"
      - "scripts/validate-space-admin-ranked.mjs"
      - "scripts/validate-space-admin-alternative-modes.mjs"
      - "scripts/validate-space-admin-audio.mjs"
      - "scripts/validate-space-admin-ui-assets.mjs"
      - "scripts/validate-space-admin-qa.mjs"
      - "scripts/validate-space-admin-telemetry.mjs"
      - ".github/workflows/admin-ci.yml"

jobs:
  admin-contract-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Initialize Space Typing submodule
        run: git submodule update --init games/space-typing
      - name: Validate Admin contract snapshot
        run: node scripts/validate-space-admin-contract.mjs
      - name: Validate complete Admin UI scope
        run: node scripts/validate-space-admin-ui.mjs
      - name: Validate Admin Phase B mapping
        run: node scripts/validate-space-admin-phase-b.mjs
      - name: Validate B06.6 Worlds + Stages mapping
        run: node scripts/validate-space-admin-worlds.mjs
      - name: Validate Typing Content canonical integration
        run: node scripts/validate-space-admin-typing-content.mjs
      - name: Validate Shop runtime ownership audit
        run: node scripts/validate-space-admin-shop.mjs
      - name: Validate Currencies runtime ownership audit
        run: node scripts/validate-space-admin-currencies.mjs
      - name: Validate Rewards & Drops runtime ownership audit
        run: node scripts/validate-space-admin-rewards.mjs
      - name: Validate Stamina / Warp runtime ownership audit
        run: node scripts/validate-space-admin-warp.mjs
      - name: Validate Missions runtime ownership audit
        run: node scripts/validate-space-admin-missions.mjs
      - name: Validate Feature Gates runtime ownership audit
        run: node scripts/validate-space-admin-feature-gates.mjs
      - name: Validate Events runtime ownership audit
        run: node scripts/validate-space-admin-events.mjs
      - name: Validate Duel runtime ownership audit
        run: node scripts/validate-space-admin-duel.mjs
      - name: Validate Ranked runtime ownership audit
        run: node scripts/validate-space-admin-ranked.mjs
      - name: Validate Alternative Modes runtime ownership audit
        run: node scripts/validate-space-admin-alternative-modes.mjs
      - name: Validate Admin Audio mapping against pinned child
        run: node scripts/validate-space-admin-audio.mjs
      - name: Validate UI Assets runtime ownership audit
        run: node scripts/validate-space-admin-ui-assets.mjs
      - name: Validate QA Sandbox runtime ownership audit
        run: node scripts/validate-space-admin-qa.mjs
      - name: Validate Overview / Analytics telemetry runtime ownership audit
        run: node scripts/validate-space-admin-telemetry.mjs
      - name: Validate Admin service syntax
        run: |
          for file in admin/*.mjs; do node --check "$file"; done
          node --check scripts/validate-space-admin-phase-b.mjs
          node --check scripts/validate-space-admin-worlds.mjs
          node --check scripts/validate-space-admin-typing-content.mjs
          node --check scripts/validate-space-admin-shop.mjs
          node --check scripts/validate-space-admin-currencies.mjs
          node --check scripts/validate-space-admin-rewards.mjs
          node --check scripts/validate-space-admin-warp.mjs
          node --check scripts/validate-space-admin-missions.mjs
          node --check scripts/validate-space-admin-feature-gates.mjs
          node --check scripts/validate-space-admin-events.mjs
          node --check scripts/validate-space-admin-duel.mjs
          node --check scripts/validate-space-admin-ranked.mjs
          node --check scripts/validate-space-admin-alternative-modes.mjs
          node --check scripts/validate-space-admin-audio.mjs
          node --check scripts/validate-space-admin-ui-assets.mjs
          node --check scripts/validate-space-admin-qa.mjs
          node --check scripts/validate-space-admin-telemetry.mjs
      - name: Test immutable revision and CAS semantics
        run: node --test admin/store.test.mjs
      - name: Test Typing Content canonical catalog
        run: node --test admin/typing-content-catalog.test.mjs
      - name: Test Shop capability contract
        run: node --test admin/shop-capability.test.mjs
      - name: Test Currencies capability contract
        run: node --test admin/currency-capability.test.mjs
      - name: Test B06.1 Ships server validation
        run: node --test admin/ship-policy.test.mjs
      - name: Test B06.1 Ships runtime envelope
        run: node --test admin/ship-runtime.test.mjs
      - name: Test B06.2 Equipment server validation
        run: node --test admin/equipment-policy.test.mjs
      - name: Test B06.2 Equipment runtime envelope
        run: node --test admin/equipment-runtime.test.mjs
      - name: Test B06.3 Skills server validation
        run: node --test admin/skill-policy.test.mjs
      - name: Test B06.3 Skills runtime envelope
        run: node --test admin/skill-runtime.test.mjs
      - name: Test B06.4 Enemies server validation
        run: node --test admin/enemy-policy.test.mjs
      - name: Test B06.4 Enemies runtime envelope
        run: node --test admin/enemy-runtime.test.mjs
      - name: Test B06.5 Bosses server validation
        run: node --test admin/boss-policy.test.mjs
      - name: Test B06.5 Bosses runtime envelope
        run: node --test admin/boss-runtime.test.mjs
      - name: Test B06.5 Boss revision lifecycle
        run: node --test admin/boss-revision-flow.test.mjs
      - name: Test B06.6 Worlds server validation
        run: node --test admin/world-policy.test.mjs
      - name: Test B06.6 Worlds runtime envelope
        run: node --test admin/world-runtime.test.mjs
      - name: Test B06.6 World revision lifecycle
        run: node --test admin/world-revision-flow.test.mjs
      - name: Test B06.6 Stages server validation
        run: node --test admin/stage-policy.test.mjs
      - name: Test B06.6 Stages runtime envelope
        run: node --test admin/stage-runtime.test.mjs
      - name: Test B06.6 Stage revision lifecycle
        run: node --test admin/stage-revision-flow.test.mjs
      - name: Install focused dependencies
        run: |
          pnpm install
          pnpm --dir portal install
          pnpm --dir games/space-typing install
      - name: Test canonical World Music Admin preview bridge
        run: node --test admin/world-music-preview.test.mjs
      - name: Test canonical Ships Admin preview bridge
        run: node --test admin/ship-registry-preview.test.mjs
      - name: Test canonical Equipment Admin preview bridge
        run: node --test admin/equipment-registry-preview.test.mjs
      - name: Test canonical Skills Admin preview bridge
        run: node --test admin/skill-registry-preview.test.mjs
      - name: Test canonical Enemies Admin preview bridge
        run: node --test admin/enemy-registry-preview.test.mjs
      - name: Test canonical Bosses Admin preview bridge
        run: node --test admin/boss-registry-preview.test.mjs
      - name: Test B06.5 Boss HTTP publish/runtime/rollback smoke
        run: node --test admin/boss-http-runtime-smoke.test.mjs
      - name: Test canonical Worlds Admin preview bridge
        run: node --test admin/world-registry-preview.test.mjs
      - name: Test B06.6 World HTTP publish/runtime/rollback smoke
        run: node --test admin/world-http-runtime-smoke.test.mjs
      - name: Test canonical Stages Admin preview bridge
        run: node --test admin/stage-config-preview.test.mjs
      - name: Test B06.6 Stage HTTP publish/runtime/rollback smoke
        run: node --test admin/stage-http-runtime-smoke.test.mjs
      - name: Test Space Typing
        run: pnpm --dir games/space-typing test
      - name: Audit Space Typing Warp economy
        run: pnpm --dir games/space-typing stamina:audit
      - name: Audit Space Typing Missions contract
        run: pnpm --dir games/space-typing missions:audit
      - name: Audit Space Typing Feature Gates contract
        run: pnpm --dir games/space-typing feature-gates:audit
      - name: Audit Space Typing Events contract
        run: pnpm --dir games/space-typing events:audit
      - name: Audit Space Typing Duel contract
        run: pnpm --dir games/space-typing duel:audit
      - name: Audit Space Typing Ranked contract
        run: pnpm --dir games/space-typing ranked:audit
      - name: Audit Space Typing Alternative Modes contract
        run: pnpm --dir games/space-typing alternative-modes:audit
      - name: Audit Space Typing UI Assets contract
        run: pnpm --dir games/space-typing ui-assets:audit
      - name: Audit Space Typing QA Sandbox contract
        run: pnpm --dir games/space-typing qa:audit
      - name: Audit Space Typing Telemetry contract
        run: pnpm --dir games/space-typing telemetry:audit
      - name: Build Space Typing
        run: pnpm build:space
      - name: Build Portal
        run: pnpm build:portal
