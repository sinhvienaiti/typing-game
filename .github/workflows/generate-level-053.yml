name: Generate Level 053 Corpus
on:
  push:
    branches: [feature/typing-text-corpus]
    paths: [.github/workflows/generate-level-053.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typing-text-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/generate-level-053.mjs
      - run: node scripts/validate-level-053.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add shared/typing-texts/levels/053.json
          git commit -m "feat: add typing text corpus level 053"
          git push origin HEAD:feature/typing-text-corpus
