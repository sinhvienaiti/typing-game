name: Publish English E04 Safe Example Links

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  publish-e04-safe-example-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply safe E04 example links
        run: node scripts/apply-english-e04-safe-example-links.mjs

      - name: Validate English content schemas
        run: pnpm english-content:validate

      - name: Validate English review ledger
        run: pnpm english-content:review:validate

      - name: Validate English E10 batch contracts
        run: pnpm english-content:e10

      - name: Validate English content licenses
        run: pnpm english-content:licenses

      - name: Run English content tests
        run: pnpm english-content:test

      - name: Generate runtime artifacts
        run: pnpm english-content:generate

      - name: Publish runtime artifacts
        run: pnpm english-content:publish

      - name: Check runtime exact dedupe
        run: pnpm english-content:dedupe

      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke

      - name: Check E11 readiness
        run: pnpm english-content:e11

      - name: Run E12 release maintenance
        run: pnpm english-content:e12

      - name: Audit master-plan acceptance
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Measure enrichment-link evidence
        run: node scripts/report-english-content-enrichment-links.mjs

      - name: Enforce safe-link acceptance delta
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const acceptance=JSON.parse(await fs.readFile("content/english/reports/master-plan-acceptance.json","utf8"));
          const links=JSON.parse(await fs.readFile("content/english/reports/e04-safe-example-links.json","utf8"));
          const errors=[];
          if(acceptance.status!=="pass") errors.push("master-plan acceptance must pass");
          if(acceptance.e04?.collocationsWithoutExamples!==592) errors.push(`expected 592 collocations without examples, got ${acceptance.e04?.collocationsWithoutExamples}`);
          if(acceptance.e04?.phraseItemsWithoutExamples!==574) errors.push(`expected 574 phrase items without examples, got ${acceptance.e04?.phraseItemsWithoutExamples}`);
          if(acceptance.e04?.verbPatternsWithoutExamples!==510) errors.push(`verb-pattern auto-linking is forbidden; expected 510 unlinked, got ${acceptance.e04?.verbPatternsWithoutExamples}`);
          if(links.linkedCollocations!==8||links.linkedPhraseItems!==26) errors.push("safe-link report must contain exactly 8 collocations + 26 phrase items");
          if(errors.length){console.error(errors.join("\n"));process.exit(1);}
          console.log(JSON.stringify({status:"pass",collocationsLinked:8,phraseItemsLinked:26,verbPatternsAutoLinked:0},null,2));
          NODE

      - name: Upload E04 linkage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e04-safe-example-links-${{ github.sha }}
          path: |
            content/english/reports/e04-safe-example-links.json
            content/english/reports/master-plan-acceptance.json
            content/english/reports/enrichment-link-evidence.json
            content/english/reports/e10-review-ledger.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit reviewed E04 safe example links
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/phrases scripts/apply-english-e04-safe-example-links.mjs
          if git diff --cached --quiet; then
            echo 'No E04 safe-link changes to commit.'
            exit 0
          fi
          git commit -m 'feat(content): link verified E04 phrase examples'
          git push
