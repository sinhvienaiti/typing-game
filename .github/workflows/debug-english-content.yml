name: Publish English E03 Usage Sidecar

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  publish-e03-usage-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply E03 usage sidecar
        run: node scripts/apply-english-e03-usage-sidecar.mjs

      - name: Validate English content schemas
        run: pnpm english-content:validate

      - name: Validate English review ledger
        run: pnpm english-content:review:validate

      - name: Validate English E10 batch contracts
        run: pnpm english-content:e10

      - name: Validate English content licenses
        run: pnpm english-content:licenses

      - name: Run English content tests
        run: pnpm english-content:test

      - name: Generate runtime artifacts
        run: pnpm english-content:generate

      - name: Publish runtime artifacts
        run: pnpm english-content:publish

      - name: Check runtime exact dedupe
        run: pnpm english-content:dedupe

      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke

      - name: Check E11 readiness
        run: pnpm english-content:e11

      - name: Run E12 release maintenance
        run: pnpm english-content:e12

      - name: Audit master-plan acceptance
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Measure enrichment-link evidence
        run: node scripts/report-english-content-enrichment-links.mjs

      - name: Enforce E03 usage-sidecar acceptance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const acceptance=JSON.parse(await fs.readFile("content/english/reports/master-plan-acceptance.json","utf8"));
          const release=JSON.parse(await fs.readFile("content/english/releases/2026.10.0.json","utf8"));
          const errors=[];
          if(acceptance.status!=="pass") errors.push("master-plan acceptance must pass");
          if(acceptance.runtimeCounts?.dictionary!==900) errors.push(`expected dictionary runtime 900, got ${acceptance.runtimeCounts?.dictionary}`);
          if(release.runtimeCounts?.dictionary!==900) errors.push(`expected release dictionary runtime 900, got ${release.runtimeCounts?.dictionary}`);
          if(acceptance.e03?.lexemes!==300||acceptance.e03?.senses!==300||acceptance.e03?.usages!==300) errors.push("E03 runtime split must be 300 lexemes + 300 senses + 300 usages");
          for(const [name,value] of Object.entries({
            lexemesWithoutUsageRefs:acceptance.e03?.lexemesWithoutUsageRefs,
            lexemesWithBrokenUsageRefs:acceptance.e03?.lexemesWithBrokenUsageRefs,
            usagesWithBrokenTargets:acceptance.e03?.usagesWithBrokenTargets,
            usagesWithoutExamples:acceptance.e03?.usagesWithoutExamples,
          })) if(value!==0) errors.push(`${name} must be 0, got ${value}`);
          if((acceptance.warnings??[]).some(item=>String(item).startsWith("Lexemes without usageRefs"))) errors.push("usageRefs warning must be closed");
          if(errors.length){console.error(errors.join("\n"));process.exit(1);}
          console.log(JSON.stringify({status:"pass",dictionary:900,lexemes:300,senses:300,usages:300,usageGraphErrors:0},null,2));
          NODE

      - name: Upload E03 usage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e03-usage-sidecar-${{ github.sha }}
          path: |
            content/english/reports/master-plan-acceptance.json
            content/english/reports/enrichment-link-evidence.json
            content/english/reports/e10-review-ledger.json
            content/english/reports/e10-batch-report.json
            content/english/releases/2026.10.0.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit reviewed E03 usage sidecar
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/dictionary shared/schemas/english-content \
            scripts/apply-english-e03-usage-sidecar.mjs scripts/validate-english-content.mjs \
            scripts/publish-english-content.mjs scripts/smoke-published-english-content.mjs \
            scripts/audit-english-content-master-plan.mjs
          if git diff --cached --quiet; then
            echo 'No E03 usage-sidecar changes to commit.'
            exit 0
          fi
          git commit -m 'feat(content): publish reviewed E03 usage sidecar'
          git push
