name: Publish English B2 Slices 01-04

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  publish-b2-01-04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply reviewed B2 slices 01-04
        shell: bash
        run: |
          if grep -q '"id": "e05.grammar-scale-b2-01"' content/english/batches/manifest.json; then
            echo 'B2 slices 01-04 already present; skipping generator.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-english-b2-01-04.py')
          text = p.read_text()
          text = text.replace('""Will you use the car this evening? when politely checking an existing plan"', '"Will you use the car this evening? when politely checking an existing plan"', 1)
          text = text.replace(
              '["The road is being repaired.","The documents have been sent.","The room had been cleaned before we arrived."]',
              '["The eastbound railway bridge is being repaired after last week\'s storm.","The documents have been sent.","The room had been cleaned before we arrived."]',
              1,
          )
          p.write_text(text)
          PY
          python3 -m py_compile scripts/apply-english-b2-01-04.py
          python3 scripts/apply-english-b2-01-04.py

      - name: Validate B2 source and review contracts
        shell: bash
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test

      - name: Generate B2 runtime artifacts
        run: pnpm english-content:generate

      - name: Publish B2 runtime artifacts
        run: pnpm english-content:publish

      - name: Collect B2 near-duplicate diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/b2-near-duplicates.json
          import path from "node:path";
          import {
            listJsonFiles,
            nearDuplicatePairs,
            readJson,
          } from "./scripts/english-content-core.mjs";

          const files = [
            ...(await listJsonFiles(path.resolve("shared/sentences"))),
            path.resolve("content/english/sentences/pilot-sentences.json"),
          ];
          const records = [];
          const seen = new Set();
          for (const file of files) {
            if (file.endsWith("manifest.json")) continue;
            const doc = await readJson(file);
            if (!Array.isArray(doc.records)) continue;
            for (const record of doc.records) {
              if (!record || typeof record.id !== "string" || typeof record.text !== "string") continue;
              if (seen.has(record.id)) continue;
              seen.add(record.id);
              records.push(record);
            }
          }
          const pairs = nearDuplicatePairs(records, 0.86).filter(
            ({leftId, rightId}) => leftId.startsWith("sent.grb2.") || rightId.startsWith("sent.grb2."),
          );
          console.log(JSON.stringify({threshold: 0.86, count: pairs.length, pairs}, null, 2));
          NODE

      - name: Check B2 runtime dedupe
        id: dedupe
        shell: bash
        run: |
          set +e
          pnpm english-content:dedupe 2>&1 | tee /tmp/english-content-dedupe.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload B2 content diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-content-diagnostics
          path: |
            /tmp/english-content-dedupe.log
            /tmp/b2-near-duplicates.json
          if-no-files-found: error
          retention-days: 3

      - name: Smoke B2 published runtime
        run: pnpm english-content:runtime:smoke

      - name: Commit B2 slices 01-04
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases scripts/smoke-published-english-content.mjs scripts/apply-english-b2-01-04.py
          if git diff --cached --quiet; then
            echo 'No B2 publication changes to commit.'
            exit 0
          fi
          git commit -m 'feat(content): publish reviewed B2 grammar slices 01-04'
          git push
