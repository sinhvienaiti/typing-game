name: Debug English Content

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: read

jobs:
  debug-rich-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Validate rich records
        run: pnpm english-content:validate

      - name: Validate licenses
        run: pnpm english-content:licenses

      - name: Test English content
        run: pnpm english-content:test

      - name: Check dedupe
        run: pnpm english-content:dedupe

      - name: Check pilot
        run: pnpm english-content:pilot

      - name: Check E04
        run: pnpm english-content:e04

      - name: Generate published artifacts
        run: pnpm english-content:generate

      - name: Publish English content
        run: pnpm english-content:publish

      - name: Check generated artifacts are committed
        run: git diff --exit-code -- shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases
