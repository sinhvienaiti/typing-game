name: Publish English E03 Example Links

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  publish-e03-example-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply reviewed E03 example links
        shell: bash
        run: |
          python3 -m py_compile scripts/apply-english-e03-example-links.py
          python3 scripts/apply-english-e03-example-links.py

      - name: Validate English content schemas
        run: pnpm english-content:validate

      - name: Validate English review ledger
        run: pnpm english-content:review:validate

      - name: Validate English E10 batch contracts
        run: pnpm english-content:e10

      - name: Validate English content licenses
        run: pnpm english-content:licenses

      - name: Run English content tests
        run: pnpm english-content:test

      - name: Generate runtime artifacts
        run: pnpm english-content:generate

      - name: Publish runtime artifacts
        run: pnpm english-content:publish

      - name: Collect E03 near-duplicate diagnostics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";
          import { listJsonFiles, nearDuplicatePairs, readJson } from "./scripts/english-content-core.mjs";

          const records=[];
          const seen=new Set();
          for(const file of await listJsonFiles(path.resolve("shared/sentences"))){
            if(file.endsWith("manifest.json")) continue;
            const doc=await readJson(file);
            for(const record of doc.records??[]){
              if(!record||typeof record.id!=="string"||typeof record.text!=="string"||seen.has(record.id)) continue;
              seen.add(record.id);
              records.push(record);
            }
          }
          const pairs=nearDuplicatePairs(records,0.86);
          const e03Pattern=/^sent\.e03\./u;
          const e03Pairs=pairs.filter(({leftId,rightId})=>e03Pattern.test(leftId)||e03Pattern.test(rightId));
          await fs.writeFile("/tmp/e03-near-duplicates.json",JSON.stringify({threshold:0.86,count:e03Pairs.length,pairs:e03Pairs},null,2)+"\n");
          console.log(JSON.stringify({globalNearCount:pairs.length,e03NearCount:e03Pairs.length},null,2));
          NODE

      - name: Check runtime exact dedupe
        run: pnpm english-content:dedupe

      - name: Enforce E03 near-duplicate review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const report=JSON.parse(await fs.readFile("/tmp/e03-near-duplicates.json","utf8"));
          if(report.count!==0){
            console.error(`E03 near-duplicate audit failed: ${report.count} candidate(s)`);
            console.error(JSON.stringify(report.pairs,null,2));
            process.exit(1);
          }
          console.log("E03 near-duplicate audit PASS: 0 candidates.");
          NODE

      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke

      - name: Check E11 readiness
        run: pnpm english-content:e11

      - name: Run E12 release maintenance
        run: pnpm english-content:e12

      - name: Audit master-plan acceptance
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Measure enrichment-link evidence
        run: node scripts/report-english-content-enrichment-links.mjs

      - name: Upload E03 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e03-example-link-diagnostics-${{ github.sha }}
          path: |
            /tmp/e03-near-duplicates.json
            content/english/reports/master-plan-acceptance.json
            content/english/reports/enrichment-link-evidence.json
            content/english/reports/e10-review-ledger.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit reviewed E03 example links
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases \
            scripts/apply-english-e03-example-links.py scripts/publish-english-content.mjs \
            scripts/smoke-published-english-content.mjs scripts/audit-english-content-master-plan.mjs
          if git diff --cached --quiet; then
            echo 'No E03 enrichment changes to commit.'
            exit 0
          fi
          git commit -m 'feat(content): publish reviewed E03 example links'
          git push
