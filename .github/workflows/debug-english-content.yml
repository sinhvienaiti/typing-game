name: Repair English Content Baseline

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  repair-rich-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Repair duplicate B1 sentence
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('content/english/sentences/e05-scale-b1-07-sentences.json')
          data = json.loads(path.read_text())
          target = next(record for record in data['records'] if record['id'] == 'sent.grb1.07.07.2')
          old = 'Please turn it off.'
          new = 'Maya turned the office projector off after the meeting.'
          if target['text'] == old:
              target['text'] = new
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          elif target['text'] != new:
              raise SystemExit(f"Unexpected text for {target['id']}: {target['text']!r}")
          PY

      - name: Validate rich content suite
        shell: bash
        run: |
          pnpm english-content:validate
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:pilot
          pnpm english-content:e04
          pnpm english-content:generate
          pnpm english-content:publish

      - name: Commit repaired source and generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases
          git commit -m 'fix(content): remove B1 sentence duplicate'
          git push
