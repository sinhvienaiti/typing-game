name: English Content Full Validation

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  validate-english-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Normalize E11 publication snapshot contract
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          const file="scripts/report-english-content-e11-readiness.mjs";
          let text=await fs.readFile(file,"utf8");
          const snapshotLine='  "docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md",\n';
          if(text.includes(snapshotLine)) {
            text=text.replace(snapshotLine,"");
            await fs.writeFile(file,text,"utf8");
            console.log("Removed derived master-plan status document from E11 publication snapshot.");
          } else if(!text.includes('"docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md"')) {
            console.log("E11 publication snapshot contract is already normalized.");
          } else {
            throw new Error("Master-plan snapshot entry exists in an unexpected form; refuse automatic migration.");
          }
          NODE

      - name: Synchronize master-plan status snapshots
        run: node scripts/sync-english-content-master-plan-status.mjs

      - name: Validate English content schemas
        run: pnpm english-content:validate

      - name: Validate English review ledger
        run: pnpm english-content:review:validate

      - name: Validate English E10 batch contracts
        run: pnpm english-content:e10

      - name: Validate English content licenses
        run: pnpm english-content:licenses

      - name: Run English content tests
        run: pnpm english-content:test

      - name: Generate runtime artifacts
        run: pnpm english-content:generate

      - name: Publish runtime artifacts
        run: pnpm english-content:publish

      - name: Check runtime exact dedupe
        run: pnpm english-content:dedupe

      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke

      - name: Check E11 readiness
        run: pnpm english-content:e11

      - name: Run E12 release maintenance
        run: pnpm english-content:e12

      - name: Audit master-plan acceptance
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Report E04 runtime coverage
        run: node scripts/report-english-content-e04.mjs

      - name: Measure enrichment-link evidence
        run: node scripts/report-english-content-enrichment-links.mjs

      - name: Verify one-time E11 migration drift
        shell: bash
        run: |
          unexpected=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ "$path" != "content/english/reports/e11-readiness.json" ]; then
              unexpected="${unexpected}${path}"$'\n'
            fi
          done < <(git diff --name-only -- shared content/english)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated English-content drift detected:' >&2
            printf '%s' "$unexpected" >&2
            git diff -- shared content/english
            exit 1
          fi
          echo 'One-time migration drift is restricted to content/english/reports/e11-readiness.json.'

      - name: Commit E11 snapshot migration and synchronized status
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/report-english-content-e11-readiness.mjs \
            docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md \
            content/english/reports/e11-readiness.json
          if git diff --cached --quiet; then
            echo 'E11 snapshot contract and status artifacts are already synchronized.'
            exit 0
          fi
          git commit -m 'fix(content): decouple E11 snapshot from master-plan status'
          git push
