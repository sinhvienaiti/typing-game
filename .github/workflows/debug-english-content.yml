name: Debug English Content

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: read

jobs:
  debug-rich-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Capture dedupe diagnostics
        shell: bash
        run: |
          set +e
          pnpm english-content:dedupe > english-dedupe.log 2>&1
          status=$?
          cat english-dedupe.log
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < english-dedupe.log
          fi
          exit "$status"
