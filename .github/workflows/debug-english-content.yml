name: English Content Full Validation

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  validate-english-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Synchronize master-plan status snapshots
        run: node scripts/sync-english-content-master-plan-status.mjs

      - name: Validate English content schemas
        run: pnpm english-content:validate

      - name: Validate English review ledger
        run: pnpm english-content:review:validate

      - name: Validate English E10 batch contracts
        run: pnpm english-content:e10

      - name: Validate English content licenses
        run: pnpm english-content:licenses

      - name: Run English content tests
        run: pnpm english-content:test

      - name: Generate runtime artifacts
        run: pnpm english-content:generate

      - name: Publish runtime artifacts
        run: pnpm english-content:publish

      - name: Check runtime exact dedupe
        run: pnpm english-content:dedupe

      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke

      - name: Prepare next E11 typing-text review slice
        run: |
          pnpm english-content:derive:typing-texts
          node scripts/prepare-typing-text-e11-review-slice.mjs --limit 24

      - name: Check E11 readiness report freshness
        run: node scripts/check-english-content-e11-readiness.mjs

      - name: Prepare E11 sentence review-gap queue
        run: node scripts/prepare-english-content-e11-review-queue.mjs --per-target-limit 12

      - name: Checkout pinned MultiWOZ source
        uses: actions/checkout@v4
        with:
          repository: budzianowski/multiwoz
          ref: fe0c8e65cfcd8462bd33c86e35f21addc84ca82b
          path: .cache/english-content/multiwoz
          sparse-checkout: |
            data/MultiWOZ_2.2/train/dialogues_001.json
            data/MultiWOZ_2.2/train/dialogues_002.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Prepare pinned MultiWOZ E11 dialogue review slice
        run: pnpm english-content:e11:dialogue:next -- --limit=24

      - name: Build controlled MultiWOZ E11 review intake
        run: node scripts/prepare-multiwoz-e11-dialogue-intake.mjs

      - name: Upload E11 review packets
        uses: actions/upload-artifact@v4
        with:
          name: e11-review-packets-${{ github.sha }}
          path: |
            content/english/review-queues/typing-text-e11-next-review.json
            content/english/review-queues/e11-sentence-gap-next-review.json
            content/english/review-queues/multiwoz-e11-dialogue-next-review.json
            content/english/review-queues/multiwoz-e11-dialogue-next-intake.json
          if-no-files-found: error
          retention-days: 7

      - name: Report exact E11 runtime counts
        run: pnpm english-content:e11:runtime

      - name: Audit E11 record-level runtime coverage
        run: pnpm english-content:e11:records

      - name: Run E12 release maintenance
        run: pnpm english-content:e12

      - name: Audit master-plan acceptance
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Report E04 runtime coverage
        run: node scripts/report-english-content-e04.mjs

      - name: Measure enrichment-link evidence
        run: node scripts/report-english-content-enrichment-links.mjs

      - name: Verify generated source/runtime artifacts are reproducible
        shell: bash
        run: |
          if ! git diff --exit-code -- shared content/english; then
            echo 'Generated English-content artifacts drift from committed source of truth.' >&2
            exit 1
          fi

      - name: Commit synchronized master-plan status
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md
          if git diff --cached --quiet; then
            echo 'Master-plan status already synchronized.'
            exit 0
          fi
          git commit -m 'docs(content): sync English content runtime status'
          git push
