name: Publish English B2 Slices 01-04

on:
  push:
    branches:
      - feature/english-learning-content-system

permissions:
  contents: write

jobs:
  publish-b2-01-04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply reviewed B2 slices 01-04
        shell: bash
        run: |
          if grep -q '"id": "e05.grammar-scale-b2-01"' content/english/batches/manifest.json; then
            echo 'B2 slices 01-04 already present; skipping generator.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-english-b2-01-04.py')
          text = p.read_text()
          bad = '""Will you use the car this evening? when politely checking an existing plan"'
          good = '"Will you use the car this evening? when politely checking an existing plan"'
          if bad in text:
              text = text.replace(bad, good, 1)
              p.write_text(text)
          elif good not in text:
              raise SystemExit('Could not locate the expected B2 Future Continuous correction target')
          PY
          python3 -m py_compile scripts/apply-english-b2-01-04.py
          python3 scripts/apply-english-b2-01-04.py

      - name: Validate B2 source and review contracts
        shell: bash
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test

      - name: Generate and publish B2 runtime artifacts
        shell: bash
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke

      - name: Commit B2 slices 01-04
        shell: bash
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/english shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases scripts/smoke-published-english-content.mjs scripts/apply-english-b2-01-04.py
          if git diff --cached --quiet; then
            echo 'No B2 publication changes to commit.'
            exit 0
          fi
          git commit -m 'feat(content): publish reviewed B2 grammar slices 01-04'
          git push
