name: Generate Level 054 Corpus
on:
  push:
    branches: [feature/typing-text-corpus]
    paths:
      - scripts/generate-level-054.mjs
      - .github/workflows/generate-level-054.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typing-text-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sed -e 's/053.json/054.json/g' -e 's/level===53/level===54/' -e 's/Level 053/Level 054/g' scripts/validate-level-053.mjs > scripts/validate-level-054.mjs
      - run: node scripts/generate-level-054.mjs
      - run: node scripts/validate-level-054.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add shared/typing-texts/levels/054.json
          git commit -m "feat: add typing text corpus level 054"
          git push origin HEAD:feature/typing-text-corpus
