name: Space Admin UI Hardening Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - name: Apply final UI hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Portal Admin shell: route cleanup, scrolling, recent ops.
          p = Path('portal/src/admin/space-typing.ts')
          s = p.read_text()
          s = s.replace('  galaxyWorlds,\n', '')
          start = s.find('  private renderWorldMusic(\n')
          end = s.find('  private renderShips(): HTMLElement {', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
          old = '''    lower.append(this.renderEconomyPanel(), this.renderAlertsPanel());\n    page.append(lower);\n    return page;\n  }\n\n  private timeFilters(): HTMLElement {'''
          new = '''    lower.append(this.renderEconomyPanel(), this.renderAlertsPanel());\n    page.append(lower, this.renderRecentOperations());\n    return page;\n  }\n\n  private renderRecentOperations(): HTMLElement {\n    const root = panel("Recent Operations", "Latest draft / publish / rollback activity", true);\n    const rows = element("div", "stx-revision-list");\n    for (const change of recentChanges) {\n      const row = element("div", "stx-revision");\n      row.append(\n        element("strong", undefined, change.revision),\n        statusBadge(change.tone.toUpperCase(), change.tone === "published" ? "good" : "warn"),\n        element("span", undefined, change.title),\n        element("small", undefined, `${change.author} · ${change.time}`),\n      );\n      rows.append(row);\n    }\n    root.append(rows);\n    return root;\n  }\n\n  private timeFilters(): HTMLElement {'''
          if old not in s:
              raise SystemExit('overview insertion target not found')
          s = s.replace(old, new)
          s = s.replace('UI REV · A-HOLO-03', 'UI REV · A-HOLO-04')
          s = s.replace('\nvoid recentChanges;\n', '\n')
          p.write_text(s)

          # 2) World Music: rerender through portal navigation instead of reload/reset.
          p = Path('portal/src/admin/space-typing-world-music-v2.ts')
          s = p.read_text()
          anchor = 'type Navigate = (path: string) => void;\n'
          if 'let currentNavigate:' not in s:
              s = s.replace(anchor, anchor + '\nlet currentNavigate: Navigate = () => undefined;\n')
          s = s.replace('location.reload();', 'currentNavigate(`${BASE}/world-music`);')
          s = s.replace('  void navigate;\n  const page = el("div");', '  currentNavigate = navigate;\n  const page = el("div");')
          p.write_text(s)

          # 3) Command palette: clean keyboard listener on every close path.
          p = Path('portal/src/admin/space-typing-command.ts')
          s = p.read_text()
          s = s.replace('let current: HTMLElement | null = null;\n', 'let current: HTMLElement | null = null;\nlet currentCleanup: (() => void) | null = null;\n')
          s = s.replace(
              'export function closeAdminCommandPalette(): void {\n  current?.remove();\n  current = null;\n}',
              'export function closeAdminCommandPalette(): void {\n  currentCleanup?.();\n  currentCleanup = null;\n  current?.remove();\n  current = null;\n}',
          )
          s = s.replace(
              '    if (event.key === "Escape") { closeAdminCommandPalette(); document.removeEventListener("keydown", onKey); }',
              '    if (event.key === "Escape") closeAdminCommandPalette();',
          )
          s = s.replace(
              '  document.addEventListener("keydown", onKey);\n  palette.append(head, results);',
              '  document.addEventListener("keydown", onKey);\n  currentCleanup = () => document.removeEventListener("keydown", onKey);\n  palette.append(head, results);',
          )
          p.write_text(s)

          # 4) Holo token aliases, correct portal scroll container, focus accessibility.
          p = Path('portal/src/admin/space-typing-ui.css')
          s = p.read_text()
          alias_anchor = '  --st-admin-gradient: linear-gradient(100deg, #5fe3ff, #a07bff);\n'
          aliases = '''\n  /* Alias the game Holo Command token names so all Admin modules share one visual system. */\n  --holo-display: var(--st-admin-display);\n  --holo-body: var(--st-admin-body);\n  --holo-text: var(--st-admin-text);\n  --holo-dim: var(--st-admin-dim);\n  --holo-faint: var(--st-admin-faint);\n  --holo-accent: var(--st-admin-accent);\n  --holo-accent-2: var(--st-admin-accent-2);\n  --holo-ink: var(--st-admin-ink);\n  --holo-panel: var(--st-admin-panel);\n  --holo-panel-solid: var(--st-admin-panel-solid);\n  --holo-field: var(--st-admin-field);\n  --holo-line: var(--st-admin-line);\n  --holo-line-strong: var(--st-admin-line-strong);\n  --holo-good: var(--st-admin-good);\n  --holo-warn: var(--st-admin-warn);\n  --holo-bad: var(--st-admin-bad);\n  --holo-cut: var(--st-admin-cut);\n  --holo-cut-sm: var(--st-admin-cut-sm);\n  --holo-gradient: var(--st-admin-gradient);\n'''
          if '--holo-display:' not in s:
              s = s.replace(alias_anchor, alias_anchor + aliases)
          s = s.replace('  min-height: calc(100vh - 64px);\n  color:', '  height: 100%;\n  min-height: 0;\n  overflow: auto;\n  color:', 1)
          s = s.replace('  min-height: calc(100vh - 64px);\n  display: grid;', '  min-height: 100%;\n  display: grid;', 1)
          s = s.replace('  height: calc(100vh - 64px);\n  overflow-y: auto;', '  height: 100%;\n  max-height: 100vh;\n  overflow-y: auto;', 1)
          focus = '''\n.st-admin :is(button,a,input,select,textarea,[tabindex]):focus-visible {\n  outline: 2px solid var(--st-admin-accent);\n  outline-offset: 2px;\n}\n\n'''
          if ':focus-visible' not in s:
              s = s.replace('@media (prefers-reduced-motion: reduce) {', focus + '@media (prefers-reduced-motion: reduce) {')
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/admin-ui-hardening-once.yml
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(admin-ui): harden Holo tokens navigation state and portal scrolling"
          git push origin HEAD:feat/space-typing-admin-uiux
