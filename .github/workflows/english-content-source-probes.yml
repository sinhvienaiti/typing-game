name: English Content Upstream Source Probes

# Run explicitly when reviewing a source refresh or reproducing an old pin.
# A checksum mismatch is a hard failure, never a reason to auto-upgrade the pin.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tatoeba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Probe Tatoeba EN-VI translation source
        run: |
          mkdir -p .cache/english-content/tatoeba
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2 \
            -o .cache/english-content/tatoeba/eng_sentences.tsv.bz2
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/vie/vie_sentences.tsv.bz2 \
            -o .cache/english-content/tatoeba/vie_sentences.tsv.bz2
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/eng/eng-vie_links.tsv.bz2 \
            -o .cache/english-content/tatoeba/eng-vie_links.tsv.bz2
          bunzip2 -kc .cache/english-content/tatoeba/eng_sentences.tsv.bz2 > .cache/english-content/tatoeba/eng_sentences.tsv
          bunzip2 -kc .cache/english-content/tatoeba/vie_sentences.tsv.bz2 > .cache/english-content/tatoeba/vie_sentences.tsv
          bunzip2 -kc .cache/english-content/tatoeba/eng-vie_links.tsv.bz2 > .cache/english-content/tatoeba/eng-vie_links.tsv
          pnpm english-content:import:tatoeba -- \
            --eng=.cache/english-content/tatoeba/eng_sentences.tsv \
            --vie=.cache/english-content/tatoeba/vie_sentences.tsv \
            --links=.cache/english-content/tatoeba/eng-vie_links.tsv
          pnpm english-content:e06:translation

      - name: Upload Tatoeba E06 translation pilot
        uses: actions/upload-artifact@v4
        with:
          name: tatoeba-e06-translation-${{ github.sha }}
          path: |
            content/english/review-queues/tatoeba-e06-sentences.json
            content/english/review-queues/tatoeba-e06-translations.json
            content/english/review-queues/tatoeba-e06-source-report.json
          if-no-files-found: error
          retention-days: 7

  wiktionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Checkout pinned Open English WordNet source
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          ref: dc343f2683279ecbb13fab4e2fd778d7b162d287
          path: .cache/english-content/oewn
          fetch-depth: 1

      - name: Build pinned OEWN E03 pilot
        run: |
          pnpm english-content:import:oewn:pinned -- --source-dir=.cache/english-content/oewn
          pnpm english-content:e03 -- --require-mapped=0.98

      - name: Upload pinned OEWN E03 pilot
        uses: actions/upload-artifact@v4
        with:
          name: oewn-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/oewn-2025-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Simple Wiktionary morphology and usage source
        run: |
          mkdir -p .cache/english-content/simplewiktionary
          curl -fL --retry 3 --retry-all-errors \
            https://kaikki.org/simplewiktionary/raw-wiktextract-data.jsonl.gz \
            -o .cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          gzip -t .cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:import:simplewiktionary -- \
            --input=.cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:e03:morphology

      - name: Upload Simple Wiktionary E03 morphology pilot
        uses: actions/upload-artifact@v4
        with:
          name: simplewiktionary-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/simplewiktionary-en-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Vietnamese Wiktionary English gloss source
        run: |
          mkdir -p .cache/english-content/viwiktionary
          curl -fL --retry 3 --retry-all-errors \
            https://kaikki.org/viwiktionary/raw-wiktextract-data.jsonl.gz \
            -o .cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          gzip -t .cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          sha256sum .cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz | awk '{print $1}' | tee .cache/english-content/viwiktionary/source-sha256.txt
          pnpm english-content:import:viwiktionary -- --input=.cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:e03:vi

      - name: Upload Vietnamese Wiktionary source observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viwiktionary-source-observation-${{ github.sha }}
          path: .cache/english-content/viwiktionary/source-sha256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Vietnamese Wiktionary E03 probe
        uses: actions/upload-artifact@v4
        with:
          name: viwiktionary-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/viwiktionary-en-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Build E03 bilingual sense review packet
        run: pnpm english-content:e03:sense-review

      - name: Upload E03 bilingual sense review packet
        uses: actions/upload-artifact@v4
        with:
          name: e03-sense-review-${{ github.sha }}
          path: content/english/review-queues/e03-sense-alignment-review.json
          if-no-files-found: error
          retention-days: 7
