name: Checkpoint process level 030
on:
  push:
    branches: [feature/typing-text-corpus]
    paths:
      - .github/workflows/checkpoint-process-030.yml
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/typing-text-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-typing-texts.mjs
      - run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/TYPING_TEXT_PROCESS.md';
          let s = fs.readFileSync(p, 'utf8');
          const marker = '- Next active level: 030.';
          if (!s.includes(marker)) throw new Error('Expected level 030 marker not found');
          s = s.replace(marker, '- Level 030: 15 passages, 3810 words, duplicate/similarity warnings 0, checkpoint `30e5dfba55afe6796800e71c46b0696e18b29f2a`.\n- Levels 011-030 cross-check: 300 passages, 77744 words, duplicate/similarity warnings 0.\n- Next active level: 031.');
          s = s.replace('Continue Batch 021-030 without stopping, starting exactly from Level 030. Levels 021-029 are complete on the checkpoint branch.', 'Batch 021-030 is complete on the checkpoint branch. Continue without stopping from Level 031 in Batch 031-040.');
          fs.writeFileSync(p, s);
          NODE
      - run: |
          rm .github/workflows/checkpoint-process-030.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/TYPING_TEXT_PROCESS.md .github/workflows/checkpoint-process-030.yml
          git commit -m "docs: checkpoint typing text level 030"
          git push origin HEAD:feature/typing-text-corpus
