name: Space Admin Phase B World Music Once

# One-shot B04.1 gate rerun after hardening preview stdout parsing.
on:
  push:
    branches:
      - feat/space-typing-admin-uiux
    paths:
      - "portal/src/admin/space-typing-world-music-phase-b.ts"
      - "scripts/apply-space-admin-phase-b-world-music.mjs"
      - ".github/workflows/admin-phase-b-world-music-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Initialize pinned Space Typing child
        run: git submodule update --init games/space-typing

      - name: Apply B04.1 World Music mapping
        run: node scripts/apply-space-admin-phase-b-world-music.mjs

      - name: Remove one-shot tooling during validation
        run: rm scripts/apply-space-admin-phase-b-world-music.mjs .github/workflows/admin-phase-b-world-music-once.yml

      - name: Validate Admin contracts
        run: |
          node scripts/validate-space-admin-contract.mjs
          node scripts/validate-space-admin-ui.mjs
          node scripts/validate-space-admin-phase-b.mjs
          node scripts/validate-space-admin-audio.mjs

      - name: Test immutable revisions and B04.1 validation
        run: node --test admin/store.test.mjs

      - name: Test canonical World Music preview bridge
        run: node --test admin/world-music-preview.test.mjs

      - name: Install Portal dependencies
        run: pnpm --dir portal install

      - name: Build Portal
        run: pnpm build:portal

      - name: Commit B04.1 mapping without workflow mutation
        run: |
          git restore --source=HEAD -- .github/workflows/admin-phase-b-world-music-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No B04.1 changes to commit"
            exit 0
          fi
          git commit -m "feat(admin): wire Phase B world music canonical drafts"
          git push origin HEAD:feat/space-typing-admin-uiux
