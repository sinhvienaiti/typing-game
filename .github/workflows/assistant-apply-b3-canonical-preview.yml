name: Assistant Apply B3 Canonical Preview

on:
  push:
    branches:
      - feat/space-typing-admin-mvp

permissions:
  contents: write

jobs:
  apply-canonical-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-mvp
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Initialize Space Typing submodule
        run: git submodule update --init games/space-typing

      - name: Apply guarded canonical preview patch
        run: python scripts/assistant/apply-b3-canonical-preview.py

      - name: Validate Admin contract and store
        run: |
          node scripts/validate-space-admin-contract.mjs
          node --test admin/store.test.mjs
          node --check admin/server.mjs
          node --check admin/world-music-preview.mjs

      - name: Install focused dependencies
        run: |
          pnpm install
          pnpm --dir portal install
          pnpm --dir games/space-typing install

      - name: Test canonical preview bridge
        run: node --test admin/world-music-preview.test.mjs

      - name: Build Portal
        run: pnpm build:portal

      - name: Diff safety
        run: git diff --check

      - name: Commit verified B3 canonical preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # admin-ci.yml is updated separately by the GitHub connector because
          # the Actions token intentionally has no workflows permission.
          git checkout -- .github/workflows/admin-ci.yml
          git add admin/server.mjs portal/src/admin/api.ts portal/src/admin/space-typing.ts
          if git diff --cached --quiet; then
            echo "No canonical preview integration changes to commit"
            exit 0
          fi
          git commit -m "feat(admin): wire canonical World music preview"
          git pull --rebase origin feat/space-typing-admin-mvp
          git push origin HEAD:feat/space-typing-admin-mvp
