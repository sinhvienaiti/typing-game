name: Checkpoint process level 034
on:
  push:
    branches: [feature/typing-text-corpus]
    paths: [.github/workflows/checkpoint-process-034.yml]
permissions: {contents: write}
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/typing-text-corpus}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/validate-typing-texts.mjs
      - run: |
          node - <<'NODE'
          const fs=require('fs'); const level=JSON.parse(fs.readFileSync('shared/typing-texts/levels/034.json')); const words=level.passages.reduce((s,p)=>s+p.wordCount,0); const p='docs/TYPING_TEXT_PROCESS.md'; let s=fs.readFileSync(p,'utf8'); const m='- Next active level: 034.'; if(!s.includes(m)) throw new Error('Expected level 034 marker not found'); s=s.replace(m,`- Level 034: 15 passages, ${words} words, duplicate/similarity warnings 0.\n- Next active level: 035.`); fs.writeFileSync(p,s);
          NODE
      - run: |
          rm .github/workflows/checkpoint-process-034.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/TYPING_TEXT_PROCESS.md .github/workflows/checkpoint-process-034.yml
          git commit -m "docs: checkpoint typing text level 034"
          git push origin HEAD:feature/typing-text-corpus
