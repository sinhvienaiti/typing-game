name: Apply English E04 Scale 68

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - scripts/apply-english-e04-focused-scale-68.py
      - scripts/check-english-e04-scale-68-candidates.py
      - .github/workflows/apply-english-e04-scale-68.yml

permissions:
  contents: write

concurrency:
  group: english-e04-scale-68
  cancel-in-progress: false

jobs:
  apply-scale-68:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Apply scale 68 preflight conflict replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-english-e04-focused-scale-68.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "    ('monitor gallery relative humidity', 'verb + noun phrase', 'theo dõi độ ẩm tương đối trong phòng trưng bày để giảm nguy cơ co giãn, nấm mốc hoặc ăn mòn vật liệu', 'C1'),",
                  "    ('track display case humidity drift', 'verb + noun phrase', 'theo dõi xu hướng lệch độ ẩm trong tủ trưng bày để phát hiện sớm khi vi khí hậu rời khỏi khoảng bảo tồn mong muốn', 'C1'),",
              ),
              (
                  "    ('calibrate environmental data loggers', 'verb + noun phrase', 'hiệu chuẩn thiết bị ghi dữ liệu môi trường để số đo nhiệt độ và độ ẩm có độ tin cậy phù hợp cho công tác bảo tồn', 'C1'),",
                  "    ('verify conservation sensor calibration', 'verb + noun phrase', 'xác nhận các cảm biến dùng cho bảo tồn đã được hiệu chuẩn đúng để dữ liệu môi trường có thể tin cậy khi đánh giá rủi ro', 'C1'),",
              ),
              (
                  "    ('replace saturated silica gel', 'verb + noun phrase', 'thay silica gel đã bão hòa để duy trì khả năng điều hòa độ ẩm bên trong tủ hoặc hộp bảo quản', 'B2'),",
                  "    ('regenerate reusable desiccant packs', 'verb + noun phrase', 'tái hoạt hóa các gói hút ẩm có thể tái sử dụng theo quy trình phù hợp để khôi phục khả năng kiểm soát độ ẩm trong bao gói bảo tồn', 'B2'),",
              ),
              (
                  "    ('encapsulate fragile documents', 'verb + noun phrase', 'bọc tài liệu mong manh trong lớp vật liệu trong suốt phù hợp để tăng hỗ trợ cơ học mà vẫn cho phép quan sát', 'C1'),",
                  "    ('interleave fragile manuscript leaves', 'verb + noun phrase', 'chèn lớp vật liệu bảo tồn giữa các lá bản thảo mong manh để giảm ma sát và tiếp xúc trực tiếp trong lưu trữ hoặc thao tác', 'C1'),",
              ),
              (
                  "    ('deploy insect monitoring traps', 'verb + noun phrase', 'bố trí bẫy giám sát côn trùng tại các vị trí chiến lược để theo dõi loài, số lượng và xu hướng hoạt động trong kho', 'B2'),",
                  "    ('map pest activity hotspots', 'verb + noun phrase', 'lập bản đồ các điểm có hoạt động sinh vật gây hại cao từ dữ liệu giám sát để ưu tiên kiểm tra và biện pháp kiểm soát trong kho', 'C1'),",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one scale-68 replacement target, found {count}: {old[:60]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Preflight all scale 68 candidates against current E04
        run: python3 scripts/check-english-e04-scale-68-candidates.py
      - name: Apply idempotent E04 scale 68 source batch
        run: python3 scripts/apply-english-e04-focused-scale-68.py
      - name: Validate review and controlled-batch contracts
        run: |
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
      - name: Generate and publish reviewed runtime
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
      - name: Run full English-content quality gates
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Converge derived publication state
        shell: bash
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
      - name: Stage reviewed source and generated runtime
        shell: bash
        run: |
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-68.py
          git status --short
          if git diff --cached --quiet; then
            echo 'Scale 68 produced no state change; it may already be applied.' >&2
            exit 1
          fi
          git diff --cached --binary > /tmp/scale68-before.patch
      - name: Verify full publication pipeline is deterministic
        shell: bash
        run: |
          pnpm english-content:generate
          pnpm english-content:publish
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:e10
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:runtime:smoke
          pnpm english-content:e11
          pnpm english-content:e12
          node scripts/audit-english-content-master-plan.mjs
          node scripts/report-english-content-e04.mjs
          node scripts/report-english-content-enrichment-links.mjs
          node scripts/sync-english-content-master-plan-status.mjs
          git add content/english shared docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md docs/ENGLISH_LEARNING_CONTENT_SYSTEM_PROGRESS.md scripts/smoke-published-english-content.mjs scripts/apply-english-e04-focused-scale-68.py
          git diff --cached --binary > /tmp/scale68-after.patch
          if ! cmp -s /tmp/scale68-before.patch /tmp/scale68-after.patch; then
            echo 'Scale 68 artifacts are not reproducible after converging and replaying the full publication pipeline.' >&2
            diff -u /tmp/scale68-before.patch /tmp/scale68-after.patch || true
            exit 1
          fi
      - name: Commit validated scale 68 artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(content): publish E04 collocation scale 68'
          git push
