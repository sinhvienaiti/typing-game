name: Assistant Apply B3 Portal Shell

on:
  push:
    branches:
      - feat/space-typing-admin-mvp

permissions:
  contents: write

jobs:
  apply-portal-shell:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-mvp
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Initialize Space Typing submodule
        run: git submodule update --init games/space-typing

      - name: Apply guarded B3 Portal shell patch
        run: python scripts/assistant/apply-b3-portal-shell.py

      - name: Validate Admin contract and store
        run: |
          node scripts/validate-space-admin-contract.mjs
          node --test admin/store.test.mjs

      - name: Install focused dependencies
        run: |
          pnpm install
          pnpm --dir portal install

      - name: Build Portal
        run: pnpm build:portal

      - name: Diff safety
        run: git diff --check

      - name: Commit verified B3 Portal shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json portal/src/main.ts portal/vite.config.ts
          if git diff --cached --quiet; then
            echo "No Portal integration changes to commit"
            exit 0
          fi
          git commit -m "feat(admin): wire Space Typing Admin into Portal"
          git pull --rebase origin feat/space-typing-admin-mvp
          git push origin HEAD:feat/space-typing-admin-mvp
