name: Space Admin Phase B UI Wire Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux
    paths:
      - "scripts/apply-space-admin-phase-b-ui-wire.mjs"
      - ".github/workflows/admin-phase-b-ui-wire-once.yml"
      - "portal/src/admin/space-typing-phase-b.ts"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply Phase B UI wiring
        run: node scripts/apply-space-admin-phase-b-ui-wire.mjs

      - name: Remove one-shot tooling before validation
        run: rm scripts/apply-space-admin-phase-b-ui-wire.mjs .github/workflows/admin-phase-b-ui-wire-once.yml

      - name: Validate Phase A and Phase B contracts
        run: |
          node scripts/validate-space-admin-ui.mjs
          node scripts/validate-space-admin-phase-b.mjs

      - name: Install Portal dependencies
        run: pnpm --dir portal install

      - name: Build Portal
        run: pnpm build:portal

      - name: Commit Phase B UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase B UI changes to commit"
            exit 0
          fi
          git commit -m "feat(admin): wire Phase B settings and flags drafts"
          git push origin HEAD:feat/space-typing-admin-uiux
