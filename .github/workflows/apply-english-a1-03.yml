          publish_path = root / "scripts/publish-english-content.mjs"
          text = publish_path.read_text(encoding="utf-8")
          anchor = 'const grammarScaleA102Mistakes=await loadRecords("content/english/sentences/e05-scale-a1-02-common-mistakes.json");'
          addition = anchor + '\nconst grammarScaleA103=await loadRecords("content/english/grammar/e05-scale-a1-03-topics.json");\nconst grammarScaleA103Sentences=await loadRecords("content/english/sentences/e05-scale-a1-03-sentences.json");\nconst grammarScaleA103Exercises=await loadRecords("content/english/sentences/e05-scale-a1-03-exercises.json");\nconst grammarScaleA103Mistakes=await loadRecords("content/english/sentences/e05-scale-a1-03-common-mistakes.json");'
          text = must_replace(text, anchor, addition, "publisher declarations")
          text = must_replace(text, 'records:[...topics,...grammarScaleA101,...grammarScaleA102]', 'records:[...topics,...grammarScaleA101,...grammarScaleA102,...grammarScaleA103]', "publisher grammar")
          text = must_replace(text, 'records:[...sentences,...grammarScaleA101Sentences,...grammarScaleA102Sentences,...reviewedTranslationSentences,...reviewedTypingTextSentences]', 'records:[...sentences,...grammarScaleA101Sentences,...grammarScaleA102Sentences,...grammarScaleA103Sentences,...reviewedTranslationSentences,...reviewedTypingTextSentences]', "publisher examples")
          text = must_replace(text, 'records:[...exercises,...grammarScaleA101Exercises,...grammarScaleA102Exercises,...reviewedE06Exercises,...reviewedTranslations,...reviewedCloze]', 'records:[...exercises,...grammarScaleA101Exercises,...grammarScaleA102Exercises,...grammarScaleA103Exercises,...reviewedE06Exercises,...reviewedTranslations,...reviewedCloze]', "publisher exercises")
          text = must_replace(text, 'records:[...reviewedCommonMistakes,...grammarScaleA101Mistakes,...grammarScaleA102Mistakes]', 'records:[...reviewedCommonMistakes,...grammarScaleA101Mistakes,...grammarScaleA102Mistakes,...grammarScaleA103Mistakes]', "publisher mistakes")
          publish_path.write_text(text, encoding="utf-8")

          validate_path = root / "scripts/validate-english-content.mjs"
          text = validate_path.read_text(encoding="utf-8")
          anchor = 'const grammarScaleA102Mistakes=await validateFile("content/english/sentences/e05-scale-a1-02-common-mistakes.json","common-mistake-set.schema.json");'
          addition = anchor + '\nconst grammarScaleA103=await validateFile("content/english/grammar/e05-scale-a1-03-topics.json","grammar-topic-set.schema.json");\nconst grammarScaleA103Sentences=await validateFile("content/english/sentences/e05-scale-a1-03-sentences.json","sentence-set.schema.json");\nconst grammarScaleA103Exercises=await validateFile("content/english/sentences/e05-scale-a1-03-exercises.json","exercise-set.schema.json");\nconst grammarScaleA103Mistakes=await validateFile("content/english/sentences/e05-scale-a1-03-common-mistakes.json","common-mistake-set.schema.json");'
          text = must_replace(text, anchor, addition, "validator declarations")
          marker = 'if (reviewedTranslationSentences&&reviewedTranslations) {'
          validation_block = r'''
if (grammarScaleA103&&grammarScaleA103Sentences&&grammarScaleA103Exercises&&grammarScaleA103Mistakes) {
  const expectedTopics=batchExpectedCount("e05.grammar-scale-a1-03","grammar-topics");
  const expectedExamples=batchExpectedCount("e05.grammar-scale-a1-03","examples");
  const expectedExercises=batchExpectedCount("e05.grammar-scale-a1-03","exercises");
  const expectedMistakes=batchExpectedCount("e05.grammar-scale-a1-03","common-mistakes");
  if (expectedTopics!==8||grammarScaleA103.records.length!==expectedTopics) errors.push("E05 A1 grammar scale 03 must contain 8 topics");
  if (expectedExamples!==24||grammarScaleA103Sentences.records.length!==expectedExamples) errors.push("E05 A1 grammar scale 03 must contain 24 examples");
  if (expectedExercises!==16||grammarScaleA103Exercises.records.length!==expectedExercises) errors.push("E05 A1 grammar scale 03 must contain 16 exercises");
  if (expectedMistakes!==8||grammarScaleA103Mistakes.records.length!==expectedMistakes) errors.push("E05 A1 grammar scale 03 must contain 8 common mistakes");
  const topicIds=new Set(grammarScaleA103.records.map(record=>record.id));
  const sentenceIds=new Set(grammarScaleA103Sentences.records.map(record=>record.id));
  const exerciseIds=new Set(grammarScaleA103Exercises.records.map(record=>record.id));
  const mistakeIds=new Set(grammarScaleA103Mistakes.records.map(record=>record.id));
  const existingTopicIds=new Set([...(grammarPilot?.records??[]),...(grammarScaleA101?.records??[]),...(grammarScaleA102?.records??[])].map(record=>record.id));
  const normalizedSentenceText=new Set([...(sentencePilot?.records??[]),...(grammarScaleA101Sentences?.records??[]),...(grammarScaleA102Sentences?.records??[])].map(record=>String(record.text??"").normalize("NFKC").trim().replace(/\s+/gu," ").toLocaleLowerCase("en-US")));
  const exampleCounts=new Map(),exerciseCounts=new Map(),mistakeCounts=new Map();
  for (const topic of grammarScaleA103.records) {
    if (topic.quality?.state!=="draft") errors.push(topic.id+": E05 A1 scale topic must remain draft; publication is ledger-overlay only");
    if (topic.cefr!=="A1") errors.push(topic.id+": E05 A1 scale topic must be A1");
    if (!allIds.has(topic.id)) errors.push(topic.id+": E05 A1 scale topic is absent from the 300-topic catalog");
    if (existingTopicIds.has(topic.id)) errors.push(topic.id+": E05 A1 scale 03 topic duplicates an already-authored grammar body");
