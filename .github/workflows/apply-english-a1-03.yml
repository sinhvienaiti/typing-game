          text = doc_path.read_text(encoding="utf-8")
          doc_replacements = [
              ('Pilot status: **SECOND CONTROLLED A1 BODY SLICE PUBLISHED LOCALLY; CONTINUING REVIEWED SCALE-UP**.', 'Pilot status: **THIRD CONTROLLED A1 BODY SLICE PUBLISHED LOCALLY; CONTINUING REVIEWED SCALE-UP**.'),
              ('- A digest-bound review ledger overlays 72 accepted records and promotes only those reviewed records at publication time.', '- The E05 grammar-body review ledger now overlays **240 digest-bound accepted records** and promotes only those reviewed records at publication time.'),
              ('- Published E05 runtime now contains **28 rich grammar topics**: the original 12-topic cross-CEFR pilot plus two controlled A1 body slices with 16 additional topics. Grammar-linked authoring now includes **84 controlled example sentences, 56 exercises and 16 linked common mistakes**.', '- Published E05 runtime now contains **36 rich grammar topics**: the original 12-topic cross-CEFR pilot plus three controlled A1 body slices with 24 additional topics. Grammar-linked authoring now includes **108 controlled example sentences, 72 exercises and 24 linked common mistakes**.'),
              ("- The original 12-topic pilot remains exactly 2 per CEFR level. A1 slice 01 adds `be` identification/negative/questions, subject pronouns, possessive adjectives, demonstratives, there is/are and a/an. A1 slice 02 adds basic `the`, noun number, countability, some/any, have/has possession, possessive `'s`, Present Simple facts/states and third-person `-s`. Every scale topic includes EN/VI concepts, formulae, use cases, forms/variations, contrasts/prerequisites, 3 examples, 2 exercises and 1 common mistake.", "- The original 12-topic pilot remains exactly 2 per CEFR level. A1 slice 01 adds `be` identification/negative/questions, subject pronouns, possessive adjectives, demonstratives, there is/are and a/an. A1 slice 02 adds basic `the`, noun number, countability, some/any, have/has possession, possessive `'s`, Present Simple facts/states and third-person `-s`. A1 slice 03 adds Present Simple negatives/questions/wh-questions, frequency adverbs, can for ability, can for permission/requests, imperatives and object pronouns. Every scale topic includes EN/VI concepts, formulae, use cases, forms/variations, contrasts/prerequisites, 3 examples, 2 exercises and 1 common mistake."),
