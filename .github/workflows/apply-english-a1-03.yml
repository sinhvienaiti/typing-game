name: Apply English A1-03

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - .github/workflows/apply-english-a1-03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-learning-content-system
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Author, review and wire A1-03
        run: python3 scripts/apply-english-a1-03.py
      - name: Validate reviewed A1-03 source
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:test
          pnpm english-content:licenses
          pnpm english-content:dedupe
      - name: Publish runtime
        run: pnpm english-content:publish
      - name: Smoke published runtime
        run: pnpm english-content:runtime:smoke
      - name: Validate controlled batches
        run: pnpm english-content:e10
      - name: Commit reviewed A1-03 slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/english/batches/manifest.json \
            content/english/grammar/e05-scale-a1-03-topics.json \
            content/english/sentences/e05-scale-a1-03-sentences.json \
            content/english/sentences/e05-scale-a1-03-exercises.json \
            content/english/sentences/e05-scale-a1-03-common-mistakes.json \
            content/english/reviews/decisions.d/e05-grammar-a1-03.json \
            content/english/releases/2026.10.0.json \
            docs/ENGLISH_LEARNING_CONTENT_SYSTEM_MASTER_PLAN.md \
            scripts/publish-english-content.mjs \
            scripts/validate-english-content.mjs \
            scripts/smoke-published-english-content.mjs \
            shared/grammar \
            shared/sentences
          git diff --cached --check
          git commit -m "feat(content): publish third A1 grammar body slice"
          git push origin HEAD:feature/english-learning-content-system
