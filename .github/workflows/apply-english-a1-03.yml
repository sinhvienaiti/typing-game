name: Apply English A1-03

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - .github/workflows/apply-english-a1-03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-learning-content-system
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Author, review and wire A1-03
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          def stable_json(value):
              return json.dumps(value, ensure_ascii=False, indent=2) + "\n"

          def write_json(relative, value):
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(stable_json(value), encoding="utf-8")

          def load_json(relative):
              return json.loads((root / relative).read_text(encoding="utf-8"))

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement anchor for {label}: {old[:120]!r}")
              return text.replace(old, new, 1)

          def provenance(record_id, source_url):
              return {
                  "sources": [{
                      "dataset": "project-original",
                      "sourceId": record_id,
                      "sourceUrl": source_url,
                      "snapshot": "2026-10",
                      "license": "LicenseRef-Project-Original",
                      "modified": False,
                  }],
                  "note": "Project-original controlled A1 grammar-body scale content; publication is review-ledger only.",
              }

          def topic_quality():
              return {
                  "state": "draft",
                  "checks": {
                      "schema": {"status": "pass", "method": "e05-grammar-a1-scale-authoring-v3"},
                      "grammar": {"status": "pending", "method": "independent-grammar-review-required"},
                      "exactDuplicate": {"status": "pass", "method": "stable-id-and-local-exact-dedup-v3"},
                      "nearDuplicate": {"status": "pending", "method": "cross-runtime-near-dedup-review-required"},
                      "naturalness": {"status": "pending", "method": "editor-review-required"},
                      "cefr": {"status": "pending", "method": "cefr-review-required"},
                      "license": {"status": "pending", "method": "project-original-license-review-required"},
                      "translation": {"status": "pending", "method": "bilingual-concept-review-required"},
                      "targetPresence": {"status": "pending", "method": "linked-content-target-review-required"},
                  },
              }

          def sentence_quality():
              return {
                  "state": "draft",
                  "checks": {
                      "schema": {"status": "pass", "method": "e05-grammar-a1-scale-authoring-v3"},
                      "grammar": {"status": "pending", "method": "independent-grammar-review-required"},
                      "exactDuplicate": {"status": "pass", "method": "stable-id-and-local-exact-dedup-v3"},
                      "nearDuplicate": {"status": "pending", "method": "cross-runtime-near-dedup-review-required"},
                      "naturalness": {"status": "pending", "method": "editor-review-required"},
                      "cefr": {"status": "pending", "method": "cefr-review-required"},
                      "license": {"status": "pending", "method": "project-original-license-review-required"},
                      "translation": {"status": "not-applicable", "method": "english-example"},
                      "targetPresence": {"status": "pending", "method": "grammar-target-review-required"},
                  },
              }

          def exercise_quality():
              return {
                  "state": "draft",
                  "checks": {
                      "schema": {"status": "pass", "method": "e05-grammar-a1-scale-authoring-v3"},
                      "grammar": {"status": "pending", "method": "independent-grammar-review-required"},
                      "exactDuplicate": {"status": "pass", "method": "stable-id-and-local-exact-dedup-v3"},
                      "nearDuplicate": {"status": "pending", "method": "cross-runtime-near-dedup-review-required"},
                      "naturalness": {"status": "pending", "method": "editor-review-required"},
                      "cefr": {"status": "pending", "method": "cefr-review-required"},
                      "license": {"status": "pending", "method": "project-original-license-review-required"},
                      "translation": {"status": "pending", "method": "exercise-translation-applicability-review-required"},
                      "targetPresence": {"status": "pending", "method": "grammar-target-review-required"},
                  },
              }

          def mistake_quality():
              return {
                  "state": "draft",
                  "checks": {
                      "schema": {"status": "pass", "method": "e05-grammar-a1-scale-authoring-v3"},
                      "grammar": {"status": "pending", "method": "independent-grammar-review-required"},
                      "exactDuplicate": {"status": "pass", "method": "stable-id-and-local-exact-dedup-v3"},
                      "nearDuplicate": {"status": "pending", "method": "cross-runtime-near-dedup-review-required"},
                      "naturalness": {"status": "pending", "method": "editor-review-required"},
                      "cefr": {"status": "pending", "method": "cefr-review-required"},
                      "license": {"status": "pending", "method": "project-original-license-review-required"},
                      "translation": {"status": "pending", "method": "bilingual-explanation-review-required"},
                      "targetStructure": {"status": "pending", "method": "grammar-target-review-required"},
                  },
              }

          specs = [
              {
                  "id": "gr.a1.present-simple-negative",
                  "title": "Present Simple: negatives",
                  "objective": "Use don't/doesn't + base verb.",
                  "concept_en": "Use don't with I/you/we/they and doesn't with he/she/it to make negative Present Simple statements; keep the main verb in the base form.",
                  "concept_vi": "Dùng don't với I/you/we/they và doesn't với he/she/it để tạo câu phủ định ở Hiện tại đơn; động từ chính giữ nguyên dạng cơ bản.",
                  "formulae": ["I/You/We/They + don't + base verb.", "He/She/It + doesn't + base verb."],
                  "when": ["Say that a routine, fact, preference or state is not true.", "Contrast a negative Present Simple statement with an affirmative one."],
                  "forms": {"negative": ["I don't drink coffee after dinner.", "Mina doesn't work on Saturdays.", "They don't live near the station."]},
                  "variations": ["Do not add third-person -s after doesn't: she doesn't work, not she doesn't works."],
                  "contrasts": ["gr.a1.present-simple-questions"],
                  "prereqs": ["gr.a1.present-simple-routines", "gr.a1.present-simple-third-person"],
                  "examples": ["I don't drink coffee after dinner.", "Mina doesn't work on Saturdays.", "They don't live near the station."],
                  "cloze_prompt": "Mina ___ work on Saturdays.", "cloze_answers": ["doesn't"], "cloze_source": 2,
                  "translation_prompt": "Tôi không uống cà phê sau bữa tối.", "translation_answers": ["I don't drink coffee after dinner."], "translation_source": 1,
                  "mistake_bad": "He doesn't works on Fridays.", "mistake_good": "He doesn't work on Fridays.",
                  "mistake_vi": "Sau doesn't, động từ chính phải ở dạng cơ bản: doesn't work, không phải doesn't works.",
              },
              {
                  "id": "gr.a1.present-simple-questions",
                  "title": "Present Simple: yes/no questions",
                  "objective": "Form Do/Does questions and short answers.",
                  "concept_en": "Use do before I/you/we/they and does before he/she/it to make Present Simple yes/no questions; use the base form of the main verb.",
                  "concept_vi": "Dùng do trước I/you/we/they và does trước he/she/it để tạo câu hỏi yes/no ở Hiện tại đơn; động từ chính dùng dạng cơ bản.",
                  "formulae": ["Do + I/you/we/they + base verb?", "Does + he/she/it + base verb?", "Yes, subject + do/does. / No, subject + don't/doesn't."],
                  "when": ["Ask whether a routine, fact, preference or state is true.", "Give a short yes/no answer without repeating the full clause."],
                  "forms": {"question": ["Do you walk to work every day?", "Does Leo play tennis after school?", "Do they need a ticket for this bus?"]},
                  "variations": ["After does, use the base verb: Does she live here?, not Does she lives here?"],
                  "contrasts": ["gr.a1.present-simple-negative", "gr.a1.wh-questions-present"],
                  "prereqs": ["gr.a1.present-simple-routines", "gr.a1.present-simple-third-person"],
                  "examples": ["Do you walk to work every day?", "Does Leo play tennis after school?", "Do they need a ticket for this bus?"],
                  "cloze_prompt": "___ Leo play tennis after school?", "cloze_answers": ["Does"], "cloze_source": 2,
                  "translation_prompt": "Bạn có đi bộ đến chỗ làm mỗi ngày không?", "translation_answers": ["Do you walk to work every day?"], "translation_source": 1,
                  "mistake_bad": "Does she lives here?", "mistake_good": "Does she live here?",
                  "mistake_vi": "Sau does trong câu hỏi, động từ chính dùng dạng cơ bản: Does she live...?, không dùng lives.",
              },
              {
                  "id": "gr.a1.wh-questions-present",
                  "title": "Present Simple: wh- questions",
                  "objective": "Ask for basic information with who/what/where/when/why/how.",
                  "concept_en": "Put a wh-word before a Present Simple question to ask for specific information such as place, time, reason or manner.",
                  "concept_vi": "Đặt từ để hỏi trước câu hỏi ở Hiện tại đơn để hỏi thông tin cụ thể như nơi chốn, thời gian, lý do hoặc cách thức.",
                  "formulae": ["Wh-word + do + I/you/we/they + base verb?", "Wh-word + does + he/she/it + base verb?"],
                  "when": ["Ask for a missing piece of basic information.", "Ask about routines, facts and regular activities."],
                  "forms": {"question": ["Where do you buy your groceries?", "What does Maya do after class?", "When do the shops close?"]},
                  "variations": ["When who or what is the subject, do/does may not appear; that subject-question pattern is treated separately from this basic object/adverbial pattern."],
                  "contrasts": ["gr.a1.present-simple-questions"],
                  "prereqs": ["gr.a1.present-simple-questions"],
                  "examples": ["Where do you buy your groceries?", "What does Maya do after class?", "When do the shops close?"],
                  "cloze_prompt": "Where ___ you buy your groceries?", "cloze_answers": ["do"], "cloze_source": 1,
                  "translation_prompt": "Khi nào các cửa hàng đóng cửa?", "translation_answers": ["When do the shops close?"], "translation_source": 3,
                  "mistake_bad": "Where does he works?", "mistake_good": "Where does he work?",
                  "mistake_vi": "Sau does trong câu hỏi wh-, động từ chính vẫn ở dạng cơ bản: Where does he work?",
              },
              {
                  "id": "gr.a1.frequency-adverbs",
                  "title": "Adverbs of frequency",
                  "objective": "Place always/usually/often/sometimes/never naturally.",
                  "concept_en": "Frequency adverbs such as always, usually, often, sometimes and never normally go before a main verb but after the verb be.",
                  "concept_vi": "Trạng từ tần suất như always, usually, often, sometimes và never thường đứng trước động từ thường nhưng đứng sau động từ be.",
                  "formulae": ["Subject + frequency adverb + main verb.", "Subject + be + frequency adverb + complement."],
                  "when": ["Say how often a routine or repeated action happens.", "Describe how often a state with be is true."],
                  "forms": {"positive": ["I usually eat breakfast at home.", "She is often busy on Monday mornings.", "We never watch TV during dinner."]},
                  "variations": ["Sometimes can also appear at the beginning or end of a clause, but the mid-position pattern is the core A1 rule."],
                  "contrasts": [],
                  "prereqs": ["gr.a1.present-simple-routines", "gr.a1.be-identification-description"],
                  "examples": ["I usually eat breakfast at home.", "She is often busy on Monday mornings.", "We never watch TV during dinner."],
                  "cloze_prompt": "I ___ eat breakfast at home.", "cloze_answers": ["usually"], "cloze_source": 1,
                  "translation_prompt": "Chúng tôi không bao giờ xem TV trong bữa tối.", "translation_answers": ["We never watch TV during dinner."], "translation_source": 3,
                  "mistake_bad": "I eat always breakfast at home.", "mistake_good": "I always eat breakfast at home.",
                  "mistake_vi": "Với động từ thường, trạng từ tần suất cơ bản đứng trước động từ chính: always eat, không phải eat always.",
              },
              {
                  "id": "gr.a1.can-ability",
                  "title": "Can/can't: ability",
                  "objective": "Talk about present ability and inability.",
                  "concept_en": "Use can + base verb for present ability and can't/cannot + base verb for present inability.",
                  "concept_vi": "Dùng can + động từ nguyên mẫu để nói về khả năng hiện tại và can't/cannot + động từ nguyên mẫu để nói về việc không có khả năng.",
                  "formulae": ["Subject + can + base verb.", "Subject + can't/cannot + base verb.", "Can + subject + base verb?"],
                  "when": ["Say what someone is able or unable to do now.", "Ask about a person's present ability."],
                  "forms": {"positive": ["I can swim across the pool."], "negative": ["My little brother can't ride a bike yet."], "question": ["Can you use this camera?"]},
                  "variations": ["Can does not change with he/she/it, and the following verb stays in the base form."],
                  "contrasts": ["gr.a1.can-permission-requests"],
                  "prereqs": ["gr.a1.subject-pronouns"],
                  "examples": ["I can swim across the pool.", "My little brother can't ride a bike yet.", "Can you use this camera?"],
                  "cloze_prompt": "I ___ swim across the pool.", "cloze_answers": ["can"], "cloze_source": 1,
                  "translation_prompt": "Em trai tôi vẫn chưa biết đi xe đạp.", "translation_answers": ["My little brother can't ride a bike yet."], "translation_source": 2,
                  "mistake_bad": "She can swims very well.", "mistake_good": "She can swim very well.",
                  "mistake_vi": "Sau can, động từ luôn ở dạng cơ bản: can swim, không dùng can swims.",
              },
              {
                  "id": "gr.a1.can-permission-requests",
                  "title": "Can: permission and simple requests",
                  "objective": "Ask for permission and make simple requests with can.",
                  "concept_en": "Use Can I...? to ask for permission and Can you...? to make a simple request; can can also give basic permission.",
                  "concept_vi": "Dùng Can I...? để xin phép và Can you...? để đưa ra yêu cầu đơn giản; can cũng có thể dùng để cho phép ở mức cơ bản.",
                  "formulae": ["Can I + base verb ...?", "Can you + base verb ...?", "You can + base verb ..."],
                  "when": ["Ask whether you may do something.", "Ask another person to do something simple.", "Give basic permission."],
                  "forms": {"question": ["Can I open the window?", "Can you help me with this bag, please?"], "positive": ["You can use my phone if you need it."]},
                  "variations": ["Please can make a request sound friendlier, but can is still less formal than could or may."],
                  "contrasts": ["gr.a1.can-ability", "gr.a2.polite-requests-permission"],
                  "prereqs": ["gr.a1.can-ability"],
                  "examples": ["Can I open the window?", "Can you help me with this bag, please?", "You can use my phone if you need it."],
                  "cloze_prompt": "___ I open the window?", "cloze_answers": ["Can"], "cloze_source": 1,
                  "translation_prompt": "Bạn có thể giúp tôi với chiếc túi này không?", "translation_answers": ["Can you help me with this bag, please?", "Can you help me with this bag?"], "translation_source": 2,
                  "mistake_bad": "Can I to sit here?", "mistake_good": "Can I sit here?",
                  "mistake_vi": "Sau can dùng trực tiếp động từ dạng cơ bản, không dùng to: Can I sit here?",
              },
              {
                  "id": "gr.a1.imperatives",
                  "title": "Imperatives and instructions",
                  "objective": "Give simple commands, directions and instructions.",
                  "concept_en": "Use the base verb without an expressed subject for a simple command or instruction; use don't + base verb for a negative imperative.",
                  "concept_vi": "Dùng động từ dạng cơ bản mà không cần nêu chủ ngữ để đưa ra mệnh lệnh hoặc hướng dẫn đơn giản; dùng don't + động từ cơ bản cho câu mệnh lệnh phủ định.",
                  "formulae": ["Base verb + ...", "Please + base verb + ...", "Don't + base verb + ..."],
                  "when": ["Give simple directions or instructions.", "Ask someone to do or not do something directly."],
                  "forms": {"positive": ["Please close the door quietly.", "Turn left at the next corner."], "negative": ["Don't touch that hot pan."]},
                  "variations": ["Please can soften a direct instruction; the grammatical verb form remains the base form."],
                  "contrasts": ["gr.a1.can-permission-requests"],
                  "prereqs": [],
                  "examples": ["Please close the door quietly.", "Turn left at the next corner.", "Don't touch that hot pan."],
                  "cloze_prompt": "___ left at the next corner.", "cloze_answers": ["Turn"], "cloze_source": 2,
                  "translation_prompt": "Đừng chạm vào cái chảo nóng đó.", "translation_answers": ["Don't touch that hot pan."], "translation_source": 3,
                  "mistake_bad": "Don't to open this box.", "mistake_good": "Don't open this box.",
                  "mistake_vi": "Sau don't trong câu mệnh lệnh phủ định, dùng động từ dạng cơ bản trực tiếp: Don't open..., không có to.",
              },
              {
                  "id": "gr.a1.object-pronouns",
                  "title": "Object pronouns",
                  "objective": "Use me/you/him/her/it/us/them after verbs and prepositions.",
                  "concept_en": "Use object pronouns such as me, him, her, us and them when the pronoun receives the action or follows a preposition.",
                  "concept_vi": "Dùng đại từ tân ngữ như me, him, her, us và them khi đại từ nhận tác động của hành động hoặc đứng sau giới từ.",
                  "formulae": ["verb + me/you/him/her/it/us/them", "preposition + me/you/him/her/it/us/them"],
                  "when": ["Replace a known person or thing after a verb.", "Use the correct pronoun after a preposition."],
                  "forms": {"positive": ["Please call me after work.", "I see her at the gym every morning.", "The teacher gives us homework every Friday."]},
                  "variations": ["You and it have the same subject and object forms; the other common personal pronouns change form."],
                  "contrasts": ["gr.a1.subject-pronouns"],
                  "prereqs": ["gr.a1.subject-pronouns"],
                  "examples": ["Please call me after work.", "I see her at the gym every morning.", "The teacher gives us homework every Friday."],
                  "cloze_prompt": "Please call ___ after work.", "cloze_answers": ["me"], "cloze_source": 1,
                  "translation_prompt": "Giáo viên giao bài tập cho chúng tôi mỗi thứ Sáu.", "translation_answers": ["The teacher gives us homework every Friday."], "translation_source": 3,
                  "mistake_bad": "Please call I after work.", "mistake_good": "Please call me after work.",
                  "mistake_vi": "Sau động từ call cần đại từ tân ngữ me, không dùng đại từ chủ ngữ I.",
              },
          ]

          topic_path = "content/english/grammar/e05-scale-a1-03-topics.json"
          sentence_path = "content/english/sentences/e05-scale-a1-03-sentences.json"
          exercise_path = "content/english/sentences/e05-scale-a1-03-exercises.json"
          mistake_path = "content/english/sentences/e05-scale-a1-03-common-mistakes.json"

          topics, sentences, exercises, mistakes = [], [], [], []
          for index, spec in enumerate(specs, start=1):
              base = f"gra1.03.{index:02d}"
              example_ids = [f"sent.{base}.{n}" for n in range(1, 4)]
              cloze_id = f"ex.cloze.{base}"
              translation_id = f"ex.translation.{base}"
              mistake_id = f"err.{base}"
              topics.append({
                  "schemaVersion": 1,
                  "id": spec["id"],
                  "cefr": "A1",
                  "title": spec["title"],
                  "objective": spec["objective"],
                  "concept": {"en": spec["concept_en"], "vi": spec["concept_vi"]},
                  "formulae": spec["formulae"],
                  "whenToUse": spec["when"],
                  "forms": spec["forms"],
                  "variations": spec["variations"],
                  "relatedCollocationIds": [],
                  "exampleIds": example_ids,
                  "commonMistakeIds": [mistake_id],
                  "contrastTopicIds": spec["contrasts"],
                  "dialogueIds": [],
                  "prerequisiteIds": spec["prereqs"],
                  "exerciseIds": [cloze_id, translation_id],
                  "quality": topic_quality(),
                  "provenance": provenance(spec["id"], topic_path),
              })
              for n, text in enumerate(spec["examples"], start=1):
                  record_id = example_ids[n - 1]
                  sentences.append({
                      "schemaVersion": 1,
                      "id": record_id,
                      "text": text,
                      "cefr": "A1",
                      "contexts": ["daily-life"],
                      "register": ["neutral"],
                      "grammarIds": [spec["id"]],
                      "lexicalIds": [],
                      "quality": sentence_quality(),
                      "provenance": provenance(record_id, sentence_path),
                  })
              exercises.append({
                  "schemaVersion": 1,
                  "id": cloze_id,
                  "type": "cloze",
                  "prompt": spec["cloze_prompt"],
                  "targetIds": [spec["id"]],
                  "acceptedAnswers": spec["cloze_answers"],
                  "sourceSentenceIds": [example_ids[spec["cloze_source"] - 1]],
                  "cefr": "A1",
                  "quality": exercise_quality(),
                  "provenance": provenance(cloze_id, exercise_path),
              })
              exercises.append({
                  "schemaVersion": 1,
                  "id": translation_id,
                  "type": "translation",
                  "prompt": spec["translation_prompt"],
                  "targetIds": [spec["id"]],
                  "acceptedAnswers": spec["translation_answers"],
                  "sourceSentenceIds": [example_ids[spec["translation_source"] - 1]],
                  "cefr": "A1",
                  "quality": exercise_quality(),
                  "provenance": provenance(translation_id, exercise_path),
              })
              mistakes.append({
                  "schemaVersion": 1,
                  "id": mistake_id,
                  "incorrect": spec["mistake_bad"],
                  "corrections": [spec["mistake_good"]],
                  "explanationVi": spec["mistake_vi"],
                  "targetIds": [spec["id"]],
                  "evidenceType": "pedagogical",
                  "quality": mistake_quality(),
                  "provenance": provenance(mistake_id, mistake_path),
              })

          assert len(topics) == 8 and len(sentences) == 24 and len(exercises) == 16 and len(mistakes) == 8
          write_json(topic_path, {"schemaVersion": 1, "records": topics})
          write_json(sentence_path, {"schemaVersion": 1, "records": sentences})
          write_json(exercise_path, {"schemaVersion": 1, "records": exercises})
          write_json(mistake_path, {"schemaVersion": 1, "records": mistakes})

          manifest = load_json("content/english/batches/manifest.json")
          batch_id = "e05.grammar-scale-a1-03"
          if any(batch.get("id") == batch_id for batch in manifest.get("batches", [])):
              raise SystemExit(f"batch already exists: {batch_id}")
          record_sets = [
              ("grammar-topics", topic_path, 8, ["schema", "grammar", "translation", "exactDuplicate", "nearDuplicate", "naturalness", "targetPresence", "cefr", "license"]),
              ("examples", sentence_path, 24, ["schema", "grammar", "translation", "exactDuplicate", "nearDuplicate", "naturalness", "targetPresence", "cefr", "license"]),
              ("exercises", exercise_path, 16, ["schema", "grammar", "translation", "exactDuplicate", "nearDuplicate", "naturalness", "targetPresence", "cefr", "license"]),
              ("common-mistakes", mistake_path, 8, ["schema", "grammar", "translation", "exactDuplicate", "nearDuplicate", "naturalness", "targetStructure", "cefr", "license"]),
          ]
          batch = {
              "id": batch_id,
              "phase": "E05",
              "category": "grammar",
              "cefr": ["A1"],
              "state": "draft",
              "recordSets": [{
                  "id": set_id,
                  "path": path,
                  "expectedCount": count,
                  "generated": False,
                  "allowedQualityStates": ["draft"],
                  "requiredChecks": checks,
              } for set_id, path, count, checks in record_sets],
              "requiredBeforePublish": [
                  "schema-validation", "reference-integrity", "exact-dedup", "near-dedup",
                  "grammar-review", "bilingual-review", "naturalness-review", "cefr-review",
                  "target-structure-review", "license-review", "cross-game-smoke",
              ],
              "gameSmokes": [
                  {"gameId": "space-typing", "activity": "grammar-challenge", "recordSetId": "grammar-topics", "sampleCount": 5},
                  {"gameId": "monkeytype", "activity": "grammar-topic", "recordSetId": "grammar-topics", "sampleCount": 5},
                  {"gameId": "monkeytype", "activity": "example-typing", "recordSetId": "examples", "sampleCount": 5},
                  {"gameId": "monkeytype", "activity": "cloze", "recordSetId": "exercises", "sampleCount": 4, "recordType": "cloze"},
