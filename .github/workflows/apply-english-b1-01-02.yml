name: Apply English B1 Slices 01-02

on:
  push:
    branches:
      - feature/english-learning-content-system
    paths:
      - .github/workflows/apply-english-b1-01-02.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-learning-content-system
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check B1 authoring helper
        run: python3 -m py_compile scripts/apply-english-b1-01-02.py
      - name: Generate reviewed B1 slices 01-02
        run: python3 scripts/apply-english-b1-01-02.py
      - name: Validate B1 authoring and review overlay
        run: |
          pnpm english-content:validate
          pnpm english-content:review:validate
          pnpm english-content:test
          pnpm english-content:licenses
          pnpm english-content:dedupe
      - name: Publish and smoke runtime
        run: |
          pnpm english-content:publish
          pnpm english-content:runtime:smoke
      - name: Run E10 E11 E12 gates
        run: |
          pnpm english-content:e10:validate
          pnpm english-content:e10:smoke
          pnpm english-content:e11
          pnpm english-content:e12:audit
      - name: Commit B1 slices 01-02
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/english/batches/manifest.json \
            content/english/grammar/e05-scale-b1-0[12]-topics.json \
            content/english/sentences/e05-scale-b1-0[12]-sentences.json \
            content/english/sentences/e05-scale-b1-0[12]-exercises.json \
            content/english/sentences/e05-scale-b1-0[12]-common-mistakes.json \
            content/english/reviews/decisions.d/e05-grammar-b1-0[12].json \
            content/english/releases/2026.10.0.json \
            content/english/reports/e11-readiness.json \
            scripts/publish-english-content.mjs \
            scripts/smoke-published-english-content.mjs \
            shared/grammar \
            shared/sentences
          git diff --cached --check
          git commit -m "feat(content): publish first B1 grammar slices"
          git push origin HEAD:feature/english-learning-content-system
