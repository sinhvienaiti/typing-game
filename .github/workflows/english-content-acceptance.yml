name: English Content Master Plan Acceptance

on:
  pull_request:
    paths:
      - "content/english/**"
      - "shared/dictionary/**"
      - "shared/grammar/**"
      - "shared/sentences/**"
      - "shared/phrases/**"
      - "shared/curriculum/**"
      - "shared/english-content/**"
      - "scripts/audit-english-content-master-plan.mjs"
      - ".github/workflows/english-content-acceptance.yml"
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Validate master-plan acceptance audit syntax
        run: node --check scripts/audit-english-content-master-plan.mjs

      - name: Audit mandatory English-content scope
        run: node scripts/audit-english-content-master-plan.mjs

      - name: Upload master-plan acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-content-master-plan-acceptance-${{ github.sha }}
          path: content/english/reports/master-plan-acceptance.json
          if-no-files-found: error
          retention-days: 7
