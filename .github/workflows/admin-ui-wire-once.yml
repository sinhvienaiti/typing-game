name: Space Admin UI Wiring Once

on:
  push:
    branches:
      - feat/space-typing-admin-uiux

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-typing-admin-uiux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Wire extended Admin routes
        run: node scripts/wire-space-admin-full-ui.mjs
      - name: Remove one-shot wiring files
        run: |
          rm scripts/wire-space-admin-full-ui.mjs
          rm .github/workflows/admin-ui-wire-once.yml
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(admin-ui): wire complete Admin UI routes"
          git push origin HEAD:feat/space-typing-admin-uiux
