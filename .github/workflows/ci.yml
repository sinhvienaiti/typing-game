name: Platform CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Initialize public CI submodules
        run: git submodule update --init games/monkeytype games/vocab-shooter games/recall-typing games/space-typing

      - name: Validate Monkeytype local Play build environment
        run: node scripts/validate-monkeytype-play-mode.mjs

      - name: Validate Karaoke Typing gitlink
        run: |
          git submodule status games/karaoke-typing
          test "$(git ls-files --stage games/karaoke-typing | awk '{print $1}')" = "160000"

      - name: Validate shell scripts
        run: bash -n dev.sh play.sh scripts/bootstrap.sh scripts/setup-nginx.sh scripts/play.sh scripts/cleanup-dev-ports.sh scripts/setup-vocabulary-sources.sh

      - name: Validate dev launcher arguments
        run: |
          bash dev.sh --help >/dev/null
          if bash dev.sh invalid-target >/dev/null 2>&1; then
            echo "dev.sh accepted an invalid target"
            exit 1
          fi

      - name: Validate play launcher arguments
        run: |
          bash play.sh --help >/dev/null
          if bash play.sh invalid-target >/dev/null 2>&1; then
            echo "play.sh accepted an invalid argument"
            exit 1
          fi

      - name: Validate empty project-port cleanup
        run: bash scripts/cleanup-dev-ports.sh --project-only 65431 65432

      - name: Validate shared learning core
        run: |
          pnpm learning:check
          pnpm learning:test

      - name: Validate shared vocabulary
        run: |
          pnpm vocab:validate
          pnpm vocab:generate
          git diff --exit-code -- shared/vocabulary/index.json shared/vocabulary/lookup.json

      - name: Validate shared vocabulary curriculum
        run: |
          pnpm curriculum:validate
          pnpm curriculum:generate
          git diff --exit-code -- shared/vocabulary/topics shared/vocabulary/parts-of-speech shared/vocabulary/grammar shared/vocabulary/curriculum/coverage.json

      - name: Validate shared typing texts
        run: |
          pnpm typing-texts:validate
          pnpm typing-texts:generate
          git diff --exit-code -- shared/typing-texts/index.json

      - name: Build E06 typing-text candidate corpus
        run: |
          pnpm english-content:derive:typing-texts
          pnpm english-content:e06-scale

      - name: Upload E06 typing-text candidates
        uses: actions/upload-artifact@v4
        with:
          name: typing-text-e06-candidates-${{ github.sha }}
          path: |
            content/english/review-queues/typing-text-e06-sentences.json
            content/english/review-queues/typing-text-e06-exercises.json
          if-no-files-found: error
          retention-days: 7

      - name: Build E06 grammar correction and transformation candidates
        run: |
          pnpm english-content:derive:grammar-e06
          pnpm english-content:e06:grammar

      - name: Upload E06 grammar candidates
        uses: actions/upload-artifact@v4
        with:
          name: grammar-e06-candidates-${{ github.sha }}
          path: |
            content/english/review-queues/grammar-e06-corrections.json
            content/english/review-queues/grammar-e06-transformations.json
          if-no-files-found: error
          retention-days: 7

      - name: Build E06 common-mistake candidates
        run: |
          pnpm english-content:derive:common-mistakes
          pnpm english-content:e06:common-mistakes

      - name: Upload E06 common-mistake candidates
        uses: actions/upload-artifact@v4
        with:
          name: common-mistakes-e06-${{ github.sha }}
          path: content/english/review-queues/grammar-e06-common-mistakes.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Tatoeba EN-VI translation source
        run: |
          mkdir -p .cache/english-content/tatoeba
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/eng/eng_sentences.tsv.bz2 \
            -o .cache/english-content/tatoeba/eng_sentences.tsv.bz2
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/vie/vie_sentences.tsv.bz2 \
            -o .cache/english-content/tatoeba/vie_sentences.tsv.bz2
          curl -fL --retry 3 --retry-all-errors \
            https://downloads.tatoeba.org/exports/per_language/eng/eng-vie_links.tsv.bz2 \
            -o .cache/english-content/tatoeba/eng-vie_links.tsv.bz2
          bunzip2 -kc .cache/english-content/tatoeba/eng_sentences.tsv.bz2 > .cache/english-content/tatoeba/eng_sentences.tsv
          bunzip2 -kc .cache/english-content/tatoeba/vie_sentences.tsv.bz2 > .cache/english-content/tatoeba/vie_sentences.tsv
          bunzip2 -kc .cache/english-content/tatoeba/eng-vie_links.tsv.bz2 > .cache/english-content/tatoeba/eng-vie_links.tsv
          pnpm english-content:import:tatoeba -- \
            --eng=.cache/english-content/tatoeba/eng_sentences.tsv \
            --vie=.cache/english-content/tatoeba/vie_sentences.tsv \
            --links=.cache/english-content/tatoeba/eng-vie_links.tsv
          pnpm english-content:e06:translation

      - name: Upload Tatoeba E06 translation pilot
        uses: actions/upload-artifact@v4
        with:
          name: tatoeba-e06-translation-${{ github.sha }}
          path: |
            content/english/review-queues/tatoeba-e06-sentences.json
            content/english/review-queues/tatoeba-e06-translations.json
            content/english/review-queues/tatoeba-e06-source-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned MultiWOZ dialogue source
        uses: actions/checkout@v4
        with:
          repository: budzianowski/multiwoz
          ref: fe0c8e65cfcd8462bd33c86e35f21addc84ca82b
          path: .cache/english-content/multiwoz
          fetch-depth: 1
          sparse-checkout: |
            data/MultiWOZ_2.2/train/dialogues_001.json
            data/MultiWOZ_2.2/train/dialogues_002.json
            LICENSE
          sparse-checkout-cone-mode: false

      - name: Build MultiWOZ E06 dialogue pilot
        run: |
          pnpm english-content:import:multiwoz -- --source-dir=.cache/english-content/multiwoz
          pnpm english-content:e06:dialogue

      - name: Upload MultiWOZ E06 dialogue pilot
        uses: actions/upload-artifact@v4
        with:
          name: multiwoz-e06-dialogues-${{ github.sha }}
          path: |
            content/english/review-queues/multiwoz-e06-dialogues.json
            content/english/review-queues/multiwoz-e06-source-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Checkout pinned Open English WordNet source
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          ref: dc343f2683279ecbb13fab4e2fd778d7b162d287
          path: .cache/english-content/oewn
          fetch-depth: 1

      - name: Build pinned OEWN E03 pilot
        run: |
          pnpm english-content:import:oewn:pinned -- --source-dir=.cache/english-content/oewn
          pnpm english-content:e03 -- --require-mapped=0.98

      - name: Upload pinned OEWN E03 pilot
        uses: actions/upload-artifact@v4
        with:
          name: oewn-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/oewn-2025-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Simple Wiktionary morphology and usage source
        run: |
          mkdir -p .cache/english-content/simplewiktionary
          curl -fL --retry 3 --retry-all-errors \
            https://kaikki.org/simplewiktionary/raw-wiktextract-data.jsonl.gz \
            -o .cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          gzip -t .cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:import:simplewiktionary -- \
            --input=.cache/english-content/simplewiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:e03:morphology

      - name: Upload Simple Wiktionary E03 morphology pilot
        uses: actions/upload-artifact@v4
        with:
          name: simplewiktionary-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/simplewiktionary-en-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Probe Vietnamese Wiktionary English gloss source
        run: |
          mkdir -p .cache/english-content/viwiktionary
          curl -fL --retry 3 --retry-all-errors \
            https://kaikki.org/viwiktionary/raw-wiktextract-data.jsonl.gz \
            -o .cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          gzip -t .cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:import:viwiktionary -- --input=.cache/english-content/viwiktionary/raw-wiktextract-data.jsonl.gz
          pnpm english-content:e03:vi

      - name: Upload Vietnamese Wiktionary E03 probe
        uses: actions/upload-artifact@v4
        with:
          name: viwiktionary-e03-pilot-${{ github.sha }}
          path: content/english/review-queues/viwiktionary-en-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Build E03 bilingual sense review packet
        run: pnpm english-content:e03:sense-review

      - name: Upload E03 bilingual sense review packet
        uses: actions/upload-artifact@v4
        with:
          name: e03-sense-review-${{ github.sha }}
          path: content/english/review-queues/e03-sense-alignment-review.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate E10 controlled content batches
        run: pnpm english-content:e10

      - name: Upload E10 batch coverage report
        uses: actions/upload-artifact@v4
        with:
          name: english-content-e10-batches-${{ github.sha }}
          path: content/english/reports/e10-batch-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Report E11 long-term corpus readiness
        run: pnpm english-content:e11

      - name: Upload E11 readiness report
        uses: actions/upload-artifact@v4
        with:
          name: english-content-e11-readiness-${{ github.sha }}
          path: content/english/reports/e11-readiness.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate editorial review ledger
        run: pnpm english-content:review:validate

      - name: Upload editorial review ledger report
        uses: actions/upload-artifact@v4
        with:
          name: english-content-review-ledger-${{ github.sha }}
          path: content/english/reports/e10-review-ledger.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate rich English learning content
        run: |
          pnpm english-content:validate
          pnpm english-content:licenses
          pnpm english-content:test
          pnpm english-content:dedupe
          pnpm english-content:pilot
          pnpm english-content:e04
          pnpm english-content:generate
          pnpm english-content:publish
          git diff --exit-code -- shared/curriculum shared/dictionary shared/grammar shared/sentences shared/phrases


      - name: Run E12 English-content maintenance audit
        run: |
          pnpm english-content:e12
          git diff --exit-code -- content/english/releases/2026.10.0.json

      - name: Upload E12 maintenance reports
        uses: actions/upload-artifact@v4
        with:
          name: english-content-e12-maintenance-${{ github.sha }}
          path: |
            content/english/reports/e12-maintenance-audit.json
            content/english/reports/e12-quality-sample.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate shared music
        run: |
          node -e "JSON.parse(require('fs').readFileSync('shared/music/index.json','utf8'))"
          node scripts/generate-music-index.mjs

      - name: Validate portal layout contract
        run: node scripts/validate-portal-layout.mjs

      - name: Validate Space Typing platform integration
        run: pnpm validate:space-integration

      - name: Validate static Play mode contract
        run: pnpm validate:play-mode

      - name: Validate data pipeline syntax
        run: |
          node --check scripts/prepare-vocabulary-candidates.mjs
          node --check scripts/build-vocabulary-library.mjs
          node --check scripts/vocabulary-curriculum-core.mjs
          node --check scripts/generate-vocabulary-curriculum.mjs
          node --check scripts/validate-vocabulary-curriculum.mjs
          node --check scripts/typing-text-core.mjs
          node --check scripts/generate-typing-texts.mjs
          node --check scripts/validate-typing-texts.mjs
          node --check scripts/report-typing-text-coverage.mjs
          node --check scripts/generate-music-index.mjs
          node --check scripts/validate-portal-layout.mjs
          node --check scripts/validate-space-integration.mjs
          node --check scripts/validate-play-mode.mjs
          node --check scripts/english-content-core.mjs
          node --check scripts/generate-english-content.mjs
          node --check scripts/validate-english-content.mjs
          node --check scripts/check-english-content-licenses.mjs
          node --check scripts/report-english-content-dedup.mjs
          node --check scripts/report-english-content-coverage.mjs
          node --check scripts/allocate-english-content-id.mjs
          node --check scripts/report-english-content-pilot.mjs
          node --check scripts/import-oewn-pilot.mjs
          node --check scripts/publish-english-content.mjs
          node --check scripts/report-english-content-e04.mjs
          node --check scripts/oewn-pinned-core.mjs
          node --check scripts/import-oewn-pinned-pilot.mjs
          node --check scripts/report-english-content-e03.mjs
          node --check scripts/import-viwiktionary-pilot.mjs
          node --check scripts/report-english-content-viwiktionary.mjs
          node --check scripts/wiktextract-enrichment-core.mjs
          node --check scripts/import-simplewiktionary-pilot.mjs
          node --check scripts/report-english-content-simplewiktionary.mjs
          node --check scripts/english-review-core.mjs
          node --check scripts/validate-english-content-reviews.mjs
          node --check scripts/build-e03-sense-review.mjs
          node --check scripts/report-english-content-e03-sense-review.mjs
          node --check scripts/validate-english-content-batches.mjs
          node --check scripts/smoke-english-content-batches.mjs
          node --check scripts/report-english-content-e11-readiness.mjs
          node --check scripts/generate-english-content-release.mjs
          node --check scripts/audit-english-content-maintenance.mjs
          node --check scripts/sample-english-content-quality.mjs
          node --check scripts/derive-typing-text-e06.mjs
          node --check scripts/report-english-content-e06-scale.mjs
          node --check scripts/derive-grammar-e06.mjs
          node --check scripts/report-english-content-e06-grammar.mjs
          node --check scripts/derive-common-mistakes-e06.mjs
          node --check scripts/report-english-content-e06-common-mistakes.mjs
          node --check scripts/tatoeba-pair-core.mjs
          node --check scripts/import-tatoeba-e06-translations.mjs
          node --check scripts/report-english-content-tatoeba.mjs
          node --check scripts/multiwoz-dialogue-core.mjs
          node --check scripts/import-multiwoz-e06-dialogues.mjs
          node --check scripts/report-english-content-multiwoz.mjs
          node --check shared/english-content/query.mjs
          node --check shared/english-content/runtime-loader.mjs
          node --check shared/english-content/capabilities.mjs
          node --check shared/english-content/review-item.mjs

      - name: Validate game registry
        run: node -e "JSON.parse(require('fs').readFileSync('portal/public/games.json','utf8'))"

      - name: Install platform and focused app dependencies
        run: |
          pnpm install
          pnpm --dir portal install
          pnpm --dir games/recall-typing install
          pnpm --dir games/space-typing install

      - name: Test Recall Typing
        run: pnpm --dir games/recall-typing test

      - name: Test Space Typing
        run: pnpm --dir games/space-typing test

      - name: Build Space Typing
        run: pnpm build:space

      - name: Build Portal
        run: pnpm build:portal

      - name: Build Recall Typing
        run: pnpm build:recall

  vocabulary-full-build:
    if: contains(github.event.head_commit.message, '[vocab-full]')
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Build full trusted vocabulary library
        run: |
          bash scripts/setup-vocabulary-sources.sh
          node scripts/prepare-vocabulary-candidates.mjs
          node scripts/build-vocabulary-library.mjs --target 18000 --minimum 15000
          node scripts/validate-vocabulary.mjs

      - name: Commit generated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/vocabulary/levels shared/vocabulary/index.json shared/vocabulary/lookup.json

          if git diff --cached --quiet; then
            echo "Vocabulary library is already up to date."
            exit 0
          fi

          git commit -m "data: generate trusted vocabulary library [skip ci]"
          git push origin HEAD:main
