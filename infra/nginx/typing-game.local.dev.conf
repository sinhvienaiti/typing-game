server {
    listen 443 ssl;
    http2 on;
    server_name feel.typing-game.local;
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    # Typing Feel (docs/games/TYPING_FEEL_SERVICE.md §4.2, §6.2): static data every game reads
    # across origins, same in play and dev. Every location repeats all its add_header lines
    # (one add_header in a location drops the server's); alias locations take no try_files
    # (alias answers 404 itself); a missing file is 404, never an SPA page.
    # Code step only: typing-feel/dist is not built yet, so / answers 404.
    root __ROOT_DIR__/typing-feel/dist;
    # JSON goes out gzipped: the legacy-218 set manifests are 4.4-5.2 KB raw and the
    # §8.4 budget is 4 KB on the wire. OGG is not listed, so audio is sent as is.
    gzip on;
    gzip_vary on;
    gzip_types application/json;
    gzip_min_length 256;
    location /v1/keys/sets/ {
        alias __ROOT_DIR__/typing-feel/public/v1/keys/sets/;
        types { audio/ogg ogg; application/json json; }
        default_type application/octet-stream;
        # No "always" here: a 404 (an OGG not pulled yet) must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /v1/health.json {
        alias __ROOT_DIR__/typing-feel/public/v1/health.json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /v1/keys/ {
        alias __ROOT_DIR__/typing-feel/public/v1/keys/;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
