server {
    listen 80;
    server_name typing-game.local monkeytype.typing-game.local shooter.typing-game.local recall.typing-game.local karaoke.typing-game.local space.typing-game.local dragon.typing-game.local td.typing-game.local survival.typing-game.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name typing-game.local;
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    root __ROOT_DIR__/portal/dist;
    index index.html;
    location /vocabulary/ {
        alias __ROOT_DIR__/shared/vocabulary/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    location /typing-texts/ {
        alias __ROOT_DIR__/shared/typing-texts/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    location /music/ {
        alias __ROOT_DIR__/shared/music/;
        add_header Cache-Control "no-cache" always;
    }
    location /api/admin/space-typing/ {
        proxy_pass http://127.0.0.1:3199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

