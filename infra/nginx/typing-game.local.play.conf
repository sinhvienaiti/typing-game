server {
    listen 80;
    server_name typing-game.local monkeytype.typing-game.local shooter.typing-game.local recall.typing-game.local karaoke.typing-game.local space.typing-game.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name typing-game.local;
    ssl_certificate /usr/local/etc/nginx/ssl/typing-game.local/typing-game.local.pem;
    ssl_certificate_key /usr/local/etc/nginx/ssl/typing-game.local/typing-game.local-key.pem;
    root /Users/jokerit/htdocs/typing-game/portal/dist;
    index index.html;
    location /vocabulary/ {
        alias /Users/jokerit/htdocs/typing-game/shared/vocabulary/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    location /typing-texts/ {
        alias /Users/jokerit/htdocs/typing-game/shared/typing-texts/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    location /music/ {
        alias /Users/jokerit/htdocs/typing-game/shared/music/;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

